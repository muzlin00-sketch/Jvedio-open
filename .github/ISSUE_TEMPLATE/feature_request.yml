name: 功能建议
description: 新功能、体验改进、界面调整
title: '[Feature] '
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        提之前可以先看一眼 [MAINTAINING.md](https://github.com/muzlin00-sketch/Jvedio-open/blob/main/MAINTAINING.md)，
        里面记录了不少"看起来该做、实际权衡后没做"的决定。

  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题
      description: 描述场景比描述方案更有用
      placeholder: 我每次……都要……，很麻烦
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的做法
      description: 有具体想法就写，没有也可以只写问题
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: 现在怎么绕过去
      description: 现有的替代做法，或者别的软件是怎么做的
    validations:
      required: false

  - type: dropdown
    id: scope
    attributes:
      label: 影响范围
      options:
        - 桌面端
        - 手机网页版
        - 两者都要
    validations:
      required: true
