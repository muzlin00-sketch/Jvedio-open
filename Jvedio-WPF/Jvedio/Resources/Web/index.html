<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#EDF3EF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<!-- 内联 favicon：避免浏览器自动请求 /favicon.ico 产生 404 -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2387A48E'/%3E%3Ctext x='16' y='23' font-size='19' font-weight='700' fill='white' text-anchor='middle' font-family='sans-serif'%3EJ%3C/text%3E%3C/svg%3E">
<title>Jvedio</title>
<style>
/* ============================================================
   设计 Token（与桌面端 CustomStyle/Tokens 保持同一套莫兰迪浅绿）
   ============================================================ */
:root {
  /* 背景层级：浅色模式越上层越白 */
  --bg-base:    #F0F0EB;
  --bg-subtle:  #F7F7F3;
  --bg-raised:  #FFFFFF;
  --bg-side:    #EDF3EF;

  /* 前景：深暖灰，不用纯黑 */
  --fg-primary:   #3A3A35;
  --fg-secondary: #6E6E66;
  --fg-muted:     #96968D;

  /* 边框：几乎不可见但能定形 */
  --border:       #DCDCD5;
  --border-soft:  #E7E7E1;

  /* 强调色：全站唯一，灰调鼠尾草绿 */
  --accent:       #87A48E;
  --accent-deep:  #5A7A63;
  --accent-soft:  #C9DBD0;
  --accent-wash:  #EDF3EF;

  /* 状态色 */
  --tag-bg:       rgba(135, 164, 142, 0.16);
  --tag-fg:       #5A7A63;

  /* 间距（4px 基准） */
  --sp-1: 4px;  --sp-2: 8px;  --sp-3: 12px;
  --sp-4: 16px; --sp-5: 20px; --sp-6: 24px;

  /* 圆角 */
  --r-sm: 6px; --r-md: 10px; --r-lg: 14px;

  /* 字号 */
  --fs-caption: 12px;
  --fs-body:    14px;
  --fs-body-lg: 16px;
  --fs-title:   18px;

  --shadow-card: 0 1px 3px rgba(58,58,53,.06), 0 4px 12px rgba(58,58,53,.04);
  --shadow-lift: 0 4px 16px rgba(58,58,53,.10);

  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  height: 100%;
  background: var(--bg-base);
  color: var(--fg-primary);
  font-family: -apple-system, BlinkMacSystemFont, "HarmonyOS Sans SC", "Microsoft YaHei", "Segoe UI", sans-serif;
  font-size: var(--fs-body);
  line-height: 1.5;
  overscroll-behavior-y: none;
}

/* 滚动条占位：让内容区在「有滚动条 / 无滚动条」两种状态下宽度一致，
   不会因为滚动条出现而让最右列卡片突然被挤。
   stable 表示始终预留该空间，避免加载过程中布局跳动。 */
html {
  scrollbar-gutter: stable;
}

/* ============================================================
   顶栏：磨砂玻璃（sticky + backdrop-filter）
   ============================================================ */
/* app 容器：作为查询容器，同时承载所有流式尺寸变量。
   为什么变量定义在 .app 而不是 :root：
   cqi 是「查询容器宽度的 1%」，必须在容器内部求值。
   若写在 :root，:root 不在任何查询容器内，cqi 无参照，整串变量会失效。 */
.app {
  width: 100%;
  min-height: 100vh;
  min-height: 100dvh;   /* 移动端地址栏收起时更准确 */

  /* 声明查询容器：子元素可用 cqi/cqw 单位 */
  container-type: inline-size;
  container-name: app;

  /* 兜底：老浏览器不支持容器查询时退回视口单位 */
  --u: 1vw;

  /* 卡片最小宽度：窄屏 136px（保证 320px 也能 2 列），宽屏最多 200px。
     这个值同时决定「一行能塞几列」——它是网格唯一的尺寸旋钮。 */
  --card-min: clamp(136px, calc(9 * var(--u) + 100px), 200px);

  /* 间距：8px → 20px 连续缩放 */
  --gap: clamp(8px, calc(1.2 * var(--u) + 4px), 20px);
  --pad: clamp(10px, calc(1.5 * var(--u) + 6px), 24px);

  /* 圆角：6px → 12px 连续缩放 */
  --r-md: clamp(6px, calc(0.5 * var(--u) + 4px), 12px);
  --r-lg: clamp(8px, calc(0.8 * var(--u) + 6px), 16px);

  /* 字号：连续缩放，避免小屏过挤 / 大屏过小 */
  --fs-caption: clamp(11px, calc(0.35 * var(--u) + 10px), 13px);
  --fs-body:    clamp(13px, calc(0.4 * var(--u) + 12px), 15px);
  --fs-body-lg: clamp(15px, calc(0.5 * var(--u) + 14px), 18px);
  --fs-title:   clamp(17px, calc(0.7 * var(--u) + 15px), 22px);
}

/* 支持容器查询时，把 --u 换成容器宽度单位（真正解决滚动条问题） */
@supports (container-type: inline-size) {
  .app { --u: 1cqi; }
}

.topbar {
  position: sticky;
  top: 0;
  z-index: 100;
  /* 顶栏内边距跟着容器缩放，窄屏更紧凑 */
  padding: calc(var(--safe-top) + var(--sp-2)) var(--sp-4) var(--sp-2);
  background: rgba(247, 247, 243, 0.82);
  backdrop-filter: saturate(180%) blur(20px);
  -webkit-backdrop-filter: saturate(180%) blur(20px);
  border-bottom: 1px solid var(--border-soft);
}

/* 窄屏（手机）顶栏进一步压缩，把高度让给内容 */
@container app (max-width: 480px) {
  .topbar { padding-left: var(--sp-3); padding-right: var(--sp-3); }
  .libs { margin-top: 6px; }
  .view-tabs { margin-top: 4px; }
}

.topbar-row {
  display: flex;
  align-items: center;
  gap: var(--sp-3);
}

.logo {
  font-size: var(--fs-title);
  font-weight: 700;
  letter-spacing: -0.02em;
  color: var(--fg-primary);
  flex-shrink: 0;
}
.logo span { color: var(--accent-deep); }

.count-badge {
  font-size: var(--fs-caption);
  color: var(--fg-muted);
  background: var(--accent-wash);
  padding: 2px var(--sp-2);
  border-radius: 100px;
  font-variant-numeric: tabular-nums;
}

/* 搜索框 */
.search-wrap {
  margin-top: var(--sp-3);
  position: relative;
}
.search-input {
  width: 100%;
  height: 40px;
  padding: 0 var(--sp-4) 0 38px;
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  background: var(--bg-raised);
  color: var(--fg-primary);
  font-size: var(--fs-body);
  outline: none;
  transition: border-color .15s, box-shadow .15s;
  -webkit-appearance: none;
}
.search-input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-wash);
}
.search-input::placeholder { color: var(--fg-muted); }
.search-icon {
  position: absolute;
  left: var(--sp-3);
  top: 50%;
  transform: translateY(-50%);
  width: 16px; height: 16px;
  color: var(--fg-muted);
  pointer-events: none;
}

/* 库筛选 */
/* 库筛选与视图标签合并到一行：两者都是「切换列表内容」的控件，
   放同一行既省高度也更符合直觉。空间不足时各自横向滚动。 */
.filter-row {
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  margin-top: var(--sp-2);
  overflow: hidden;
}

.libs {
  display: flex;
  gap: var(--sp-2);
  overflow-x: auto;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
  flex-shrink: 0;
  max-width: 55%;
}
.libs::-webkit-scrollbar { display: none; }

.lib-chip {
  flex-shrink: 0;
  padding: var(--sp-1) var(--sp-3);
  border-radius: 100px;
  border: 1px solid var(--border);
  background: var(--bg-raised);
  color: var(--fg-secondary);
  font-size: var(--fs-caption);
  cursor: pointer;
  transition: all .15s;
  white-space: nowrap;
}
.lib-chip.active {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}

/* ============================================================
   卡片网格
   ============================================================ */
/* ============================================================
   流式自适应（Fluid Scaling）

   为什么不用断点阶梯：
   断点是「离散跳变」——每加一档要手写一条 @media，
   且档位之间的设备（折叠屏、平板分屏、桌面小窗）永远覆盖不全。

   为什么用容器查询单位 cqi 而不是 vw：
   vw 是「视口宽度的 1%」，包含滚动条占的那 15-17px。
   桌面浏览器一旦出现纵向滚动条，vw 算出来的尺寸就会比真实可用宽度大，
   表现正是「最右边一列卡片被截断」。
   cqi 是「查询容器内容宽度的 1%」，天然排除滚动条，且能正确处理
   平板分屏、侧边栏挤压等场景。这是现代浏览器（2023+）的标准能力。

   三层配合：
   1. cqi + clamp() 让字号、间距、圆角、卡片宽连续缩放，无跳变
   2. auto-fill + minmax() 让列数由「可用宽度 ÷ 最小卡片宽」自然决定
   3. 只保留必要的方向性查询（横屏压缩顶栏），那属于布局语义而非尺寸

   结果：任何宽度都是连续过渡，不存在「没覆盖到」的尺寸，
   也不会因滚动条而溢出。
   ============================================================ */

.grid {
  display: grid;
  /* ------------------------------------------------------------
     自适应网格：卡片大小随容器宽度连续变化，且尽量填满整行

     为什么不用 minmax(MIN, 1fr)：
     1fr 会把列拉满，卡片宽度由「(容器 - 间隙) ÷ 列数」强行均分，
     列数一变宽度就跳变，且内容少的卡片被撑出大片空白。

     为什么不用 minmax(MIN, MAX)：
     列数由上限 MAX 决定，MIN 不起作用——窄屏会退化成 1 列，
     宽屏右侧又会空出很大一块（实测 2560px 空 533px）。

     最终方案：minmax(MIN, 1fr) 保证列数由 MIN 决定（卡片永远 ≥ MIN，
     一行尽可能多塞），再用 justify-content: center 让最后一列
     的余量均分到两侧，而不是堆在右边。
     卡片自身用 align-self: start 按内容定高，不被同行拉伸。
     ------------------------------------------------------------ */
  grid-template-columns: repeat(auto-fill, minmax(var(--card-min), 1fr));
  gap: var(--gap);
  justify-content: center;
  padding: var(--pad);
  padding-bottom: calc(var(--pad) * 2 + var(--safe-bottom));
}

/* 超宽屏：限制内容宽度并居中，避免一行 12 张卡把眼睛拉散 */
@media (min-width: 1600px) {
  .grid {
    max-width: 1760px;
    margin: 0 auto;
  }
}

/* 横屏矮视口：大幅压缩顶栏，把高度让给内容。
   这是方向语义（横屏时纵向空间最宝贵），保留 media query。 */
@media (max-height: 560px) and (orientation: landscape) {
  .topbar {
    padding-top: calc(var(--safe-top) + 6px);
    padding-bottom: 6px;
  }
  .search-wrap { margin-top: 6px; }
  .search-input { height: 34px; }
  .libs { margin-top: 6px; }
  .view-tabs { margin-top: 4px; }
  .lib-chip { padding: 3px 10px; }
  .view-tab { padding: 3px 10px; }
  .icon-btn { width: 32px; height: 32px; }
}

.card {
  background: var(--bg-raised);
  border-radius: var(--r-md);
  overflow: hidden;
  box-shadow: var(--shadow-card);
  cursor: pointer;
  transition: transform .18s ease, box-shadow .18s ease;
  position: relative;
  display: flex;
  flex-direction: column;
  /* 同行卡片等高（网格默认行为 stretch），
     视觉上整齐；内容区用 flex 撑满剩余高度，
     避免内容少的卡片底部出现空白断层。 */
  height: 100%;
  /* 移动端：去掉 300ms 点击延迟，并禁止双击缩放。
     没有这个属性时，快速连点卡片会被浏览器判成 double-tap 缩放，
     页面会短暂「跳一下」——用户感知就是「点了刷新」。 */
  touch-action: manipulation;
  /* 长按不选中文字 / 不弹图片保存菜单 */
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}
.card:active { transform: scale(.97); }

.card-cover {
  position: relative;
  width: 100%;
  /* 封面比例与片库实际素材精确对齐。
     实测 SmallPic 随机抽样 500 张（共 1349 张）：
     中位 0.7350，众数 0.73（450/500 张），最小 0.7034。
     原来写 3/4（0.75）会横向裁掉约 2%，
     用 0.735 后与素材完全吻合，封面内容完整可见。 */
  aspect-ratio: 735 / 1000;
  /* 不参与 flex 压缩：封面永远保持该比例，
     多出来的高度全部给下方的信息区 */
  flex: 0 0 auto;
  background: var(--bg-subtle);
  overflow: hidden;
}
.card-cover img {
  width: 100%; height: 100%;
  object-fit: cover;
  display: block;
  opacity: 0;
  transition: opacity .3s;
}
.card-cover img.loaded { opacity: 1; }

/* 骨架占位 */
.card-cover::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, var(--bg-subtle) 25%, #EFEFEA 50%, var(--bg-subtle) 75%);
  background-size: 200% 100%;
  animation: shimmer 1.4s infinite;
}
.card-cover.ready::before { display: none; }
@keyframes shimmer {
  0%   { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}

/* 缺图占位：短视频等记录本就没有封面 */
.cover-placeholder {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  color: var(--border);
  background: var(--bg-subtle);
}
.cover-placeholder svg { width: 32px; height: 32px; }

/* 标签 */
.card-tags {
  position: absolute;
  right: var(--sp-2);
  bottom: var(--sp-2);
  display: flex;
  gap: var(--sp-1);
  flex-wrap: wrap;
  justify-content: flex-end;
}
.tag {
  font-size: 11px;
  padding: 1px 6px;
  border-radius: var(--r-sm);
  background: rgba(255,255,255,.92);
  color: var(--tag-fg);
  font-weight: 500;
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
}

.card-info {
  padding: var(--sp-2) var(--sp-3) var(--sp-3);
  /* 撑满封面之外的剩余高度：卡片等高时，
     内容少的那张把空白留在自己内部，不会出现「半截卡片」的观感 */
  flex: 1 1 auto;
  display: flex;
  flex-direction: column;
  /* 内容从顶部开始排，多余空间留在底部（而不是把文字撑散） */
  justify-content: flex-start;
}
.card-vid {
  font-family: Consolas, "Cascadia Mono", monospace;
  font-size: 15px;
  font-weight: 700;
  color: var(--fg-primary);
  letter-spacing: 0.01em;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
/* 无识别码时用正常字体 + 两行截断（文件名通常比识别码长） */
.card-vid.is-text {
  font-family: inherit;
  font-size: var(--fs-caption);
  font-weight: 500;
  line-height: 1.35;
  white-space: normal;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
}
.card-date {
  font-size: var(--fs-caption);
  color: var(--fg-muted);
  margin-top: 2px;
  font-variant-numeric: tabular-nums;
}
.card-title {
  font-size: var(--fs-caption);
  color: var(--fg-secondary);
  margin-top: var(--sp-1);
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  line-height: 1.4;
}

/* ============================================================
   加载 / 空态
   ============================================================ */
.loading, .empty {
  grid-column: 1 / -1;
  text-align: center;
  padding: var(--sp-6) 0;
  color: var(--fg-muted);
  font-size: var(--fs-caption);
}
.spinner {
  width: 22px; height: 22px;
  border: 2px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  margin: 0 auto var(--sp-2);
  animation: spin .7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ============================================================
   详情页（点击卡片文字区进入）
   ============================================================ */
.detail-page {
  position: fixed;
  inset: 0;
  /* 高于播放页：详情页总是「从列表进入」，是较后打开的一层。
     若低于播放页，从详情页点播放的瞬间会看到播放页被压在下面一闪。 */
  z-index: 210;
  background: var(--bg-base);
  display: none;
  flex-direction: column;
  opacity: 0;
  transition: opacity .2s;
}
.detail-page.show { display: flex; opacity: 1; }

.detail-head {
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  padding: calc(var(--safe-top) + var(--sp-2)) var(--sp-4);
  background: rgba(247, 247, 243, .92);
  backdrop-filter: saturate(180%) blur(20px);
  -webkit-backdrop-filter: saturate(180%) blur(20px);
  border-bottom: 1px solid var(--border-soft);
  /* 固定高度，不参与 flex 压缩——否则内容多时头部会被压扁 */
  flex-shrink: 0;
}

/* 头部内容与正文同宽同边距：
   正文有 padding，头部外层也要有同样的 padding，
   否则窄屏下返回按钮会比正文更靠左，看起来错位。 */
.detail-head-inner {
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  width: 100%;
  max-width: 1400px;
  margin: 0 auto;
}
.detail-back {
  background: var(--bg-raised);
  color: var(--fg-primary);
  border: 1px solid var(--border);
}
.detail-head-vid {
  flex: 1;
  min-width: 0;
  font-family: Consolas, "Cascadia Mono", monospace;
  font-weight: 700;
  font-size: var(--fs-body-lg);
  color: var(--fg-primary);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.detail-play-top {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 7px var(--sp-3);
  border: none;
  border-radius: 100px;
  background: var(--accent);
  color: #fff;
  font-size: var(--fs-caption);
  font-weight: 600;
  cursor: pointer;
  flex-shrink: 0;
}
.detail-play-top svg { width: 15px; height: 15px; }
.detail-play-top:active { background: var(--accent-deep); }

.detail-body {
  flex: 1;
  /* min-height: 0 是必须的。
     flex 子项默认 min-height: auto，意味着「不能比内容更矮」，
     于是内容一多就把容器撑破，overflow-y: auto 永远不触发——
     表现为详情页根本滚不动。
     显式设 0 后，容器才允许被压缩，滚动条才会出现。 */
  min-height: 0;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: var(--sp-4);
  padding-bottom: calc(var(--sp-6) + var(--safe-bottom));
  /* 宽屏下限制正文宽度并居中，避免一行拉太长。
     上限给到 1400px：1440 屏左右各留 20px 就基本铺满，
     不像之前 900px 那样在宽屏上左右各空出两三百像素。
     移动端 width:100% 仍然生效，不受影响。 */
  width: 100%;
  max-width: 1400px;
  margin: 0 auto;
}

/* 顶部：大图 + 基本信息 */
.detail-hero {
  display: flex;
  gap: var(--sp-4);
  margin-bottom: var(--sp-4);
  align-items: flex-start;
}
/* 宽屏下 hero 不要铺满整行。
   封面固定 190px，右侧信息只有四五短行，
   铺满会让文字挤在最左、右边空出近千像素。
   收窄到 680px 后，封面与文字靠在一起，读起来是个整体。
   680 而不是 760：768px 屏上 760 几乎等于全宽，等于没设。 */
@media (min-width: 720px) {
  .detail-hero { max-width: 680px; }
}
.detail-cover {
  width: clamp(110px, 30%, 190px);
  flex-shrink: 0;
  aspect-ratio: 735 / 1000;
  border-radius: var(--r-md);
  overflow: hidden;
  background: var(--bg-subtle);
  box-shadow: var(--shadow-card);
}
.detail-cover img {
  width: 100%; height: 100%;
  object-fit: cover;
  display: block;
}
.detail-hero-info {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: var(--sp-2);
}
.detail-title {
  font-size: var(--fs-body-lg);
  font-weight: 600;
  color: var(--fg-primary);
  line-height: 1.4;
}
.detail-meta-line {
  font-size: var(--fs-caption);
  color: var(--fg-secondary);
  display: flex;
  flex-wrap: wrap;
  gap: var(--sp-1) var(--sp-3);
}
.detail-meta-line span { white-space: nowrap; }

/* 区块 */
.detail-section { margin-top: var(--sp-5); }
.detail-section-title {
  font-size: var(--fs-body);
  font-weight: 600;
  color: var(--fg-primary);
  margin-bottom: var(--sp-2);
  display: flex;
  align-items: center;
  gap: var(--sp-2);
}
.detail-section-title::before {
  content: '';
  width: 3px;
  height: 14px;
  border-radius: 2px;
  background: var(--accent);
}
.detail-text {
  font-size: var(--fs-caption);
  color: var(--fg-secondary);
  line-height: 1.7;
  white-space: pre-wrap;
  word-break: break-word;
}

/* 标签墙 */
.detail-chips {
  display: flex;
  flex-wrap: wrap;
  gap: var(--sp-2);
}
.detail-chip {
  padding: 4px var(--sp-3);
  border-radius: 100px;
  background: var(--bg-raised);
  border: 1px solid var(--border);
  color: var(--fg-secondary);
  font-size: var(--fs-caption);
}

/* 演员 */
.detail-actors {
  display: flex;
  flex-wrap: wrap;
  gap: var(--sp-3);
}
.detail-actor {
  width: 72px;
  text-align: center;
}
.detail-actor img {
  width: 72px;
  height: 72px;
  border-radius: 50%;
  object-fit: cover;
  background: var(--bg-subtle);
  display: block;
}
.detail-actor-name {
  font-size: 11px;
  color: var(--fg-secondary);
  margin-top: 5px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* 内容截图 */
.detail-shots {
  display: grid;
  /* 移动端下限 140px 在 320px 屏只剩 1 列（可用宽 273px，140×2+8=288 放不下）。
     降到 120px 后 320 屏能排 2 列（120×2+8=248 < 273）。 */
  grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
  gap: var(--sp-2);
}
/* 宽屏下固定 6 列：
   auto-fill 在 1400px 会排到 7 列，12 张图变成「7+5」很散。
   6 列正好 2 行排满；单张约 215px，密度比 4 列的 340px 舒服得多。 */
@media (min-width: 720px) {
  .detail-shots { grid-template-columns: repeat(6, 1fr); gap: var(--sp-2); }
}
@media (min-width: 1200px) {
  .detail-shots { gap: var(--sp-3); }
}
.detail-shot {
  aspect-ratio: 16 / 9;
  border-radius: var(--r-sm);
  overflow: hidden;
  background: var(--bg-subtle);
  cursor: pointer;
  position: relative;
}
/* 加载中的骨架微光，让「正在拉图」和「没有图」在视觉上可区分 */
.detail-shot::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, var(--bg-subtle) 25%, #EFEFEA 50%, var(--bg-subtle) 75%);
  background-size: 200% 100%;
  animation: shimmer 1.4s infinite;
}
.detail-shot.ok::before { display: none; }
.detail-shot img {
  width: 100%; height: 100%;
  object-fit: cover;
  display: block;
  opacity: 0;
  transition: opacity .25s;
}
.detail-shot.ok img { opacity: 1; }
.detail-shot:active { opacity: .85; }
.detail-shot.failed { display: none; }

/* 底部主操作 */
.detail-actions {
  display: flex;
  gap: var(--sp-3);
  margin-top: var(--sp-5);
  flex-wrap: wrap;
  align-items: center;
}
.detail-play-btn {
  flex: 1;
  min-width: 140px;
  height: 46px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--sp-2);
  border: none;
  border-radius: var(--r-md);
  background: var(--accent);
  color: #fff;
  font-size: var(--fs-body);
  font-weight: 600;
  cursor: pointer;
}
.detail-play-btn svg { width: 19px; height: 19px; }
.detail-play-btn:active { background: var(--accent-deep); }

/* 详情页的投屏按钮：与播放主按钮并排，但视觉上是次要操作 */
.detail-cast-btn {
  flex: 0 0 auto;
  width: 46px;
  height: 46px;
  display: grid;
  place-items: center;
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  background: var(--bg-raised);
  color: var(--fg-primary);
  cursor: pointer;
}
.detail-cast-btn svg { width: 20px; height: 20px; }
.detail-cast-btn:active { background: var(--bg-subtle); }

/* 宽屏下播放按钮不该拉满整行。
   手机上 flex:1 铺满是对的（好点），但 1400px 宽时会被拉成一条
   700px 的长条，视觉上很怪。给个上限，并靠左对齐。 */
@media (min-width: 720px) {
  .detail-play-btn { flex: 0 0 auto; width: 220px; }
  .detail-actions { justify-content: flex-start; }
}

/* 详情页里的星星用深色（浅底） */
.detail-actions .actions-row { margin-top: 0; }
.detail-actions .star { color: var(--border); }
.detail-actions .star.on { color: #C9A961; }
.detail-actions .rating-text { color: var(--fg-secondary); }
.detail-actions .fav-btn {
  border-color: var(--border);
  background: var(--bg-raised);
  color: var(--fg-secondary);
}
.detail-actions .fav-btn.on {
  background: rgba(201, 169, 97, .14);
  border-color: rgba(201, 169, 97, .5);
  color: #A8863F;
}

/* 大图预览遮罩 */
.shot-viewer {
  position: fixed;
  inset: 0;
  z-index: 320;
  background: rgba(0, 0, 0, .92);
  display: none;
  align-items: center;
  justify-content: center;
  padding: var(--sp-4);
}
.shot-viewer.show { display: flex; }
.shot-viewer img {
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
}

/* ============================================================
   播放页（全屏覆盖）
   ============================================================ */
.player-page {
  position: fixed;
  inset: 0;
  z-index: 200;
  background: #14140F;
  display: none;
  flex-direction: column;
  opacity: 0;
  transition: opacity .22s;
}
.player-page.show { display: flex; opacity: 1; }

.player-head {
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  padding: calc(var(--safe-top) + var(--sp-2)) var(--sp-3);
  color: #EDEAE6;
  flex-shrink: 0;
}
.back-btn {
  width: 38px; height: 38px;
  display: grid;
  place-items: center;
  border: none;
  background: rgba(255,255,255,.1);
  border-radius: var(--r-sm);
  color: #EDEAE6;
  cursor: pointer;
  flex-shrink: 0;
}
.back-btn:active { background: rgba(255,255,255,.18); }
.player-vid {
  font-family: Consolas, monospace;
  font-weight: 700;
  font-size: var(--fs-body-lg);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  /* 撑满中间，把投屏按钮推到最右 */
  flex: 1;
  min-width: 0;
}

/* 播放页投屏按钮 */
.cast-btn {
  width: 38px; height: 38px;
  display: grid;
  place-items: center;
  border: none;
  background: rgba(255,255,255,.1);
  border-radius: var(--r-sm);
  color: #EDEAE6;
  cursor: pointer;
  flex-shrink: 0;
}
.cast-btn svg { width: 19px; height: 19px; }
.cast-btn:active { background: rgba(255,255,255,.18); }
/* 已投屏时高亮，让人一眼看出当前在投 */
.cast-btn.on {
  background: var(--accent);
  color: #fff;
}

/* ============================================================
   投屏选择面板
   ============================================================ */
.cast-mask {
  position: fixed;
  inset: 0;
  z-index: 260;
  background: rgba(20,20,15,.5);
  opacity: 0;
  pointer-events: none;
  transition: opacity .2s;
}
.cast-mask.show { opacity: 1; pointer-events: auto; }

.cast-sheet {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  z-index: 261;
  background: var(--bg-base);
  border-radius: 18px 18px 0 0;
  padding: 0 var(--sp-4) calc(var(--sp-4) + var(--safe-bottom));
  max-height: 70vh;
  display: flex;
  flex-direction: column;
  transform: translateY(100%);
  transition: transform .26s cubic-bezier(.32,.72,0,1);
}
.cast-sheet.show { transform: translateY(0); }

/* 桌面端居中显示 */
@media (min-width: 720px) {
  .cast-sheet {
    left: 50%; right: auto; bottom: auto; top: 50%;
    width: min(480px, 90vw);
    border-radius: var(--r-lg);
    transform: translate(-50%, -46%);
    opacity: 0;
  }
  .cast-sheet.show { transform: translate(-50%, -50%); opacity: 1; }
}

.cast-handle {
  width: 36px; height: 4px;
  border-radius: 2px;
  background: var(--border);
  margin: var(--sp-2) auto var(--sp-1);
  flex-shrink: 0;
}
@media (min-width: 720px) { .cast-handle { display: none; } }

.cast-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: var(--sp-3) 0 var(--sp-2);
  flex-shrink: 0;
}
.cast-title {
  font-size: var(--fs-body);
  font-weight: 600;
  color: var(--fg-primary);
}
.cast-refresh {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  border: none;
  background: none;
  color: var(--accent-deep);
  font-size: var(--fs-caption);
  cursor: pointer;
  padding: 4px 6px;
}
.cast-refresh svg { width: 14px; height: 14px; }
.cast-refresh.spinning svg { animation: spin .8s linear infinite; }

.cast-list {
  overflow-y: auto;
  min-height: 0;
  flex: 1;
  padding-bottom: var(--sp-2);
}

.cast-item {
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  padding: var(--sp-3);
  border-radius: var(--r-md);
  cursor: pointer;
  border: 1px solid transparent;
}
.cast-item:active { background: var(--bg-subtle); }
.cast-item.on {
  background: var(--bg-raised);
  border-color: var(--accent);
}
.cast-item-icon {
  width: 38px; height: 38px;
  border-radius: var(--r-sm);
  background: var(--bg-subtle);
  display: grid;
  place-items: center;
  flex-shrink: 0;
  color: var(--fg-secondary);
}
.cast-item-icon svg { width: 20px; height: 20px; }
.cast-item.on .cast-item-icon { background: var(--accent); color: #fff; }
.cast-item-main { flex: 1; min-width: 0; }
.cast-item-name {
  font-size: var(--fs-body);
  color: var(--fg-primary);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.cast-item-sub {
  font-size: 11px;
  color: var(--fg-secondary);
  margin-top: 2px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.cast-item-state {
  font-size: var(--fs-caption);
  color: var(--accent-deep);
  flex-shrink: 0;
}

.cast-tip {
  padding: var(--sp-4) 0;
  text-align: center;
  font-size: var(--fs-caption);
  color: var(--fg-secondary);
  flex-shrink: 0;
}

/* 轻量提示条 */
.toast-item {
  position: fixed;
  left: 50%;
  bottom: calc(72px + var(--safe-bottom));
  z-index: 400;
  transform: translate(-50%, 12px);
  max-width: 82vw;
  padding: 10px var(--sp-4);
  border-radius: 100px;
  background: rgba(38, 38, 32, .92);
  backdrop-filter: saturate(180%) blur(12px);
  -webkit-backdrop-filter: saturate(180%) blur(12px);
  color: #F2F0EC;
  font-size: var(--fs-caption);
  text-align: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity .22s, transform .22s;
}
.toast-item.show {
  opacity: 1;
  transform: translate(-50%, 0);
}

/* ============================================================
   投屏遥控界面（播放页在投屏时的形态）
   —— 参考 YouTube / Netflix / B 站：投屏后播放页不关闭，
   视频区换成设备状态，进度与按键继续可用来遥控远端。
   ============================================================ */
.cast-panel {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--sp-3);
  width: 100%;
  max-width: 400px;
  padding: var(--sp-5) var(--sp-4);
  color: #EDEAE6;
  text-align: center;
}

.cast-panel-ring {
  width: 64px; height: 64px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: rgba(255,255,255,.07);
  border: 2px solid var(--accent);
  color: var(--accent);
}
.cast-panel-ring svg { width: 30px; height: 30px; }

.cast-panel-device {
  font-size: var(--fs-body-lg);
  font-weight: 600;
  color: #EDEAE6;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 100%;
  white-space: nowrap;
}

.cast-panel-state {
  font-size: var(--fs-caption);
  color: #9A9690;
  margin-top: -6px;
}

.cast-progress {
  width: 100%;
  margin-top: var(--sp-2);
  /* 进度条本身只有 4px 高，手指按不准。
     视觉保持细线，用上下 padding 把触摸区撑到 ~28px。 */
  padding: 12px 0 4px;
  box-sizing: border-box;
}
.cast-progress-track {
  position: relative;
  height: 4px;
  border-radius: 2px;
  background: rgba(255,255,255,.16);
  cursor: pointer;
  /* 触摸时不要触发页面滚动/缩放，否则拖不动 */
  touch-action: none;
}
.cast-progress-track.dragging { /* 拖拽中加粗，给反馈 */ }
.cast-progress-track.dragging .cast-progress-bar { background: #fff; }
.cast-progress-bar {
  position: relative;
  height: 100%;
  width: 0;
  border-radius: 2px;
  background: var(--accent);
  /* 拖拽时不要过渡，否则跟手有延迟；只有轮询更新时才平滑 */
  transition: width .5s linear;
}
.cast-progress-track.dragging .cast-progress-bar { transition: none; }

/* 拖拽把手 */
.cast-progress-knob {
  position: absolute;
  right: -6px;
  top: 50%;
  width: 12px;
  height: 12px;
  margin-top: -6px;
  border-radius: 50%;
  background: #fff;
  box-shadow: 0 1px 4px rgba(0,0,0,.4);
  opacity: 0;
  transition: opacity .18s;
  pointer-events: none;
}
.cast-progress-track:hover .cast-progress-knob,
.cast-progress-track.dragging .cast-progress-knob {
  opacity: 1;
}
/* 触屏设备没有 hover，始终显示把手（更明确可拖） */
@media (hover: none) {
  .cast-progress-knob { opacity: 1; }
}
.cast-progress-time {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-top: 6px;
  font-family: Consolas, monospace;
  font-size: 11px;
  color: #9A9690;
}
.cast-progress-sep { opacity: .5; }

.cast-controls {
  display: flex;
  align-items: center;
  gap: var(--sp-5);
  margin-top: var(--sp-2);
}
.cast-ctrl-btn {
  width: 52px; height: 52px;
  border-radius: 50%;
  border: none;
  background: rgba(255,255,255,.1);
  color: #EDEAE6;
  display: grid;
  place-items: center;
  cursor: pointer;
}
.cast-ctrl-btn svg { width: 24px; height: 24px; }
.cast-ctrl-btn:active { background: rgba(255,255,255,.2); }

.cast-disconnect {
  margin-top: var(--sp-4);
  padding: 10px var(--sp-5);
  border-radius: 100px;
  border: 1px solid rgba(255,255,255,.24);
  background: transparent;
  color: #EDEAE6;
  font-size: var(--fs-caption);
  cursor: pointer;
}
.cast-disconnect:active { background: rgba(255,255,255,.12); }

.video-wrap {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #000;
  min-height: 0;
  position: relative;
  overflow: hidden;
}
.video-wrap video {
  width: 100%;
  max-height: 100%;
  display: block;
  background: #000;
}

/* ============================================================
   自写播放控件

   为什么不用 <video controls> 的原生控件：
   移动端（尤其 Android Chrome / 鸿蒙）进入全屏后，
   原生控件会在几秒后自动隐藏，进度条和快进随之消失，
   用户无法拖动进度——这正是要解决的问题。

   为什么不用 Plyr / video.js：
   手机是通过 http://<局域网IP>:5200 访问的，
   离线或关流量时访问不到 CDN；把库内联进来要 100KB+，
   而定制度要求又高（要贴合莫兰迪配色），自写更可控。
   ============================================================ */
.vc {
  position: absolute;
  inset: 0;
  z-index: 5;
  display: flex;
  flex-direction: column;
  /* 底部控件贴底，顶部控件贴顶。
     注意：不能用 space-between——非全屏时 .vc-top 是 display:none，
     只剩 .vc-bottom 一个流式子元素，space-between 会把它顶到最上面，
     导致进度条跑到画面顶部。
     改用 margin-top:auto 让底部条自己贴底，与顶部是否隐藏无关。 */
  justify-content: flex-end;
  opacity: 1;
  transition: opacity .25s;
  /* 让点击穿透到 video 之外，仅控件本身接收事件 */
  pointer-events: none;
}
.vc.hidden { opacity: 0; }

.vc-top {
  display: none;   /* 非全屏时由页面自身的 player-head 承担标题与返回 */
  align-items: flex-start;
  gap: var(--sp-2);
  padding: calc(var(--safe-top) + 10px) 12px 10px;
  background: linear-gradient(to bottom, rgba(0,0,0,.62), rgba(0,0,0,0));
  pointer-events: auto;
  /* 容器是 flex-end，用 auto 外边距把顶栏推回顶部 */
  margin-bottom: auto;
}
/* 全屏时页面顶栏不可见，改由控件层提供标题与关闭按钮 */
.video-wrap:fullscreen .vc-top,
.video-wrap:-webkit-full-screen .vc-top { display: flex; }

.vc-close {
  width: 36px;
  height: 36px;
  flex-shrink: 0;
  display: grid;
  place-items: center;
  border: none;
  border-radius: 50%;
  background: rgba(0,0,0,.4);
  color: #fff;
  cursor: pointer;
  padding: 0;
}
.vc-close svg { width: 20px; height: 20px; }

.vc-title {
  flex: 1;
  min-width: 0;
  color: #fff;
  font-size: var(--fs-caption);
  line-height: 36px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  text-shadow: 0 1px 3px rgba(0,0,0,.6);
}

.vc-bottom {
  padding: 10px 12px calc(var(--safe-bottom) + 10px);
  background: linear-gradient(to top, rgba(0,0,0,.72), rgba(0,0,0,0));
  pointer-events: auto;
}

/* 进度条：默认细线，交互时加粗并浮出滑块。
   触摸目标外扩到 20px 高，手指好按。 */
.vc-progress {
  position: relative;
  height: 20px;
  display: flex;
  align-items: center;
  cursor: pointer;
  touch-action: none;
}
.vc-track {
  position: relative;
  width: 100%;
  height: 3px;
  border-radius: 2px;
  background: rgba(255,255,255,.24);
  transition: height .16s ease;
}
/* 悬停/拖动时轨道加粗，滑块浮现 */
.vc-progress:hover .vc-track,
.vc-progress.dragging .vc-track { height: 5px; }

.vc-buffer {
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 0;
  border-radius: 2px;
  background: rgba(255,255,255,.32);
}
.vc-played {
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 0;
  border-radius: 2px;
  background: var(--accent);
}
/* 滑块平时隐藏，只在悬停/拖动时出现，画面更干净 */

/* 倍速 */
.vc-rate {

/* 中央大播放按钮（暂停时显示） */
.vc-center {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  width: 64px;
  height: 64px;
  display: grid;
  place-items: center;
  border: none;
  border-radius: 50%;
  background: rgba(0,0,0,.46);
  color: #fff;
  cursor: pointer;
  pointer-events: auto;
  transition: opacity .2s, transform .2s;
}

.vc-center.hide { opacity: 0; pointer-events: none; transform: translate(-50%, -50%) scale(.86); }

/* 加载中 */
.vc-loading {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  width: 34px;
  height: 34px;
  border: 3px solid rgba(255,255,255,.24);
  border-top-color: #fff;
  border-radius: 50%;
  animation: vcspin .8s linear infinite;
  pointer-events: none;
}
@keyframes vcspin { to { transform: translate(-50%, -50%) rotate(360deg); } }

/* 双击左右两侧快退/快进 10 秒的视觉反馈 */
.vc-skip {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  padding: 10px 16px;
  border-radius: 10px;
  background: rgba(0,0,0,.58);

  font-size: 13px;
  font-weight: 600;
  opacity: 0;

}

.vc-skip.right { right: 10%; }

/* 横向滑动时的位置预览浮层

.vc-swipe-tip {
  position: absolute;
  top: 18%;
  left: 50%;
  transform: translate(-50%, -6px);

  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);

}

.vc-swipe-tip-delta.back { color: #FFA857; }

/* 滑动中：把进度条保持在可见状态，让用户看到位置变化 */
.vc.swiping .vc-bottom { opacity: 1; pointer-events: auto; }

/* 相似推荐占位骨架。
   高度按真实卡片的宽高比撑开（图 3:4 + 下方一行 VID），
   这样数据到达前后页面总高度一致，不会「先滚不动、突然能滚」。 */
.similar-ph { pointer-events: none; }
.similar-ph-img {
  width: 100%;
  aspect-ratio: 3 / 4;
  border-radius: var(--r-sm);
  background: linear-gradient(100deg, var(--bg-subtle) 30%, #EFEFEA 50%, var(--bg-subtle) 70%);
  background-size: 200% 100%;
  animation: phShimmer 1.2s ease-in-out infinite;
}
.similar-ph::after {
  content: '';
  display: block;
  height: 12px;
  margin-top: 4px;
  border-radius: 3px;
  background: var(--bg-subtle);
  width: 60%;
}
@keyframes phShimmer {

  to   { background-position: -50% 0; }

<script>
/* ============================================================
   Jvedio 局域网播放前端

   设计约束：
   - 单文件，无构建步骤，直接由 LanServer 托管
   - 移动优先，兼容安卓平板 / 鸿蒙平板浏览器
   - 无限滚动，避免一次性拉 2362 条
   - 图片懒加载，只在进入视口时请求
   ============================================================ */
(function () {
  'use strict';

  var API = '';                    // 同源，无需前缀
  var PAGE_SIZE = 30;

  /* ============================================================
     访问令牌

     桌面端可以设置访问口令。开启后：
     - 本机（这台设备）第一次访问要输口令，之后长期记住；
     - 令牌存在 localStorage，请求时自动带上；
     - /stream/ 与 /image/ 走 img/src、video/src，无法带自定义头，
       所以统一用 ?token= 查询参数（fetch 场景也用它，行为一致）。

     未开启口令时 token 为空，所有逻辑自然跳过，用户完全无感。
     ============================================================ */

  var TOKEN_KEY = 'jvedio_token';

  function getToken() {
    try { return localStorage.getItem(TOKEN_KEY) || ''; } catch (e) { return ''; }
  }

  function setToken(t) {
    try {
      if (t) localStorage.setItem(TOKEN_KEY, t);
      else localStorage.removeItem(TOKEN_KEY);
    } catch (e) { /* 隐私模式下可能抛异常，忽略 */ }
  }

  /**
   * 给 URL 附加令牌。
   * 已经有 ?cast= 这类参数时用 & 连接。
   */
  function withToken(url) {
    var t = getToken();
    if (!t) return url;
    return url + (url.indexOf('?') >= 0 ? '&' : '?') + 'token=' + encodeURIComponent(t);
  }

  /**
   * 统一的 fetch 封装：自动带令牌，遇到 401 弹出登录。
   */
  function apiFetch(url, options) {
    options = options || {};
    var headers = options.headers || {};
    var t = getToken();
    if (t) headers['Authorization'] = 'Bearer ' + t;
    options.headers = headers;

    return fetch(url, options).then(function (r) {
      // 令牌失效（桌面端改了口令 / 过期）：清掉并重新要口令
      if (r.status === 401) {
        setToken('');
        showLogin('登录已失效，请重新输入口令');
        throw new Error('unauthorized');
      }
      return r;
    });
  }

  var state = {
    page: 1,
    totalPages: 1,
    totalCount: 0,
    keyword: '',
    dbId: 0,
    loading: false,
    done: false,
    // 筛选条件：字段名 -> 选中值数组
    filters: {},
    mode: 'list',     // 'list' | 'random'
    view: '',         // '' | 'favorite' | 'recent'
    sort: '',
    // 随机推荐的结果快照。播放页退出后浏览器可能重建页面，
    // 靠它把「随机推荐」恢复回来，而不是退回默认列表。
    randomItems: null,
  };

  /* ============================================================
     背景滚动锁（引用计数）

     详情页、播放页、筛选面板都要求「打开时背景不能滚」。
     如果各自直接写 body.style.overflow，后关闭的那个会把锁清掉，
     导致还有一层开着但背景已经能滚。

     用计数器：加锁 +1，解锁 -1，只有归零才真正恢复滚动。
     这样无论关闭顺序如何，结果都正确。
     ============================================================ */
  var scrollLocks = 0;

  function lockScroll() {
    scrollLocks++;
    document.body.style.overflow = 'hidden';
  }

  function unlockScroll() {
    scrollLocks = Math.max(0, scrollLocks - 1);
    if (scrollLocks === 0)
      document.body.style.overflow = '';
  }

  var grid = document.getElementById('grid');
  var countBadge = document.getElementById('countBadge');
  var searchInput = document.getElementById('searchInput');
  var libsEl = document.getElementById('libs');
  var progressBar = document.getElementById('progressBar');

  var randomBtn = document.getElementById('randomBtn');
  var filterBtn = document.getElementById('filterBtn');
  var sheetMask = document.getElementById('sheetMask');
  var filterSheet = document.getElementById('filterSheet');
  var sheetBody = document.getElementById('sheetBody');
  var sheetApply = document.getElementById('sheetApply');
  var sheetReset = document.getElementById('sheetReset');

  var playerPage = document.getElementById('playerPage');
  var playerVid = document.getElementById('playerVid');
  var playerMeta = document.getElementById('playerMeta');
  var videoWrap = document.getElementById('videoWrap');
  var backBtn = document.getElementById('backBtn');

  var castBtn = document.getElementById('castBtn');
  var castMask = document.getElementById('castMask');
  var castSheet = document.getElementById('castSheet');
  var castList = document.getElementById('castList');
  var castTip = document.getElementById('castTip');
  var castRefresh = document.getElementById('castRefresh');

  // 标记「本次关闭是由返回键触发的」，避免重复回退历史
  var playerClosingByBack = false;

  /* ---------- 工具 ---------- */

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }

  /**
   * 轻量提示条。
   *
   * 项目里没有现成的 toast，投屏成功/停止需要即时反馈，
   * 用系统 alert 会打断操作，所以这里做一个自动消失的浮层。
   * 同一时刻只保留一条，新的顶掉旧的。
   */
  var _toastEl = null;
  var _toastTimer = null;

  function toast(text) {
    if (_toastEl) {
      _toastEl.remove();
      _toastEl = null;
    }
    if (_toastTimer) {
      clearTimeout(_toastTimer);
      _toastTimer = null;
    }

    var box = el('div', 'toast-item', text);
    document.body.appendChild(box);
    _toastEl = box;

    // 下一帧加 show，让过渡动画生效
    requestAnimationFrame(function () { box.classList.add('show'); });

    _toastTimer = setTimeout(function () {
      box.classList.remove('show');
      setTimeout(function () {
        if (box.parentNode) box.parentNode.removeChild(box);
        if (_toastEl === box) _toastEl = null;
      }, 260);
    }, 2200);
  }

  function formatSize(bytes) {
    if (!bytes) return '';
    var gb = bytes / 1073741824;
    if (gb >= 1) return gb.toFixed(1) + ' GB';
    return Math.round(bytes / 1048576) + ' MB';
  }

  function formatDuration(min) {
    if (!min) return '';
    var h = Math.floor(min / 60), m = min % 60;
    return h > 0 ? h + ' 小时 ' + m + ' 分' : m + ' 分钟';
  }

  /**
   * 从路径或已有 FileName 取显示名。
   * 短片没有识别码，用文件名兜底，避免整片"未知编号"。
   */
  function fileNameOf(fileName) {
    if (!fileName) return null;
    var s = String(fileName);
    // 去掉可能的路径前缀与扩展名（后端通常已处理好，这里做双保险）
    s = s.replace(/^.*[\\\/]/, '').replace(/\.[a-z0-9]{2,4}$/i, '');
    return s.trim() || null;
  }

  function showProgress(on) {
    progressBar.classList.toggle('active', on);
    if (on) progressBar.style.width = '30%';
    else {
      progressBar.style.width = '100%';
      setTimeout(function () { progressBar.classList.remove('active'); progressBar.style.width = '0'; }, 280);
    }
  }

  /* ---------- 数据加载 ---------- */

  function buildUrl() {
    var u = API + '/api/videos?page=' + state.page + '&pageSize=' + PAGE_SIZE;
    if (state.dbId > 0) u += '&dbId=' + state.dbId;
    if (state.keyword) u += '&keyword=' + encodeURIComponent(state.keyword);
    if (state.view) u += '&view=' + encodeURIComponent(state.view);
    if (state.sort) u += '&sort=' + encodeURIComponent(state.sort);

    // 筛选条件：同名多值用逗号连接，由后端按 OR 处理
    Object.keys(state.filters).forEach(function (field) {
      var arr = state.filters[field];
      if (arr && arr.length) {
        u += '&' + field + '=' + encodeURIComponent(arr.join(','));
      }
    });
    return u;
  }

  function loadPage() {
    if (state.loading || state.done) return;
    state.loading = true;
    showProgress(true);

    if (state.page === 1) {
      grid.innerHTML = '';
      grid.appendChild(el('div', 'loading', '')).innerHTML = '<div class="spinner"></div>加载中…';
    }

    apiFetch(buildUrl())
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(function (data) {
        if (state.page === 1) grid.innerHTML = '';

        state.totalPages = data.TotalPages || 1;
        state.totalCount = data.TotalCount || 0;
        countBadge.textContent = state.totalCount.toLocaleString() + ' 部';

        var items = data.Items || [];
        if (items.length === 0 && state.page === 1) {
          grid.appendChild(el('div', 'empty', '没有找到内容'));
        } else {
          items.forEach(function (item) { grid.appendChild(renderCard(item)); });
        }

        if (state.page >= state.totalPages) {
          state.done = true;
          if (items.length > 0) grid.appendChild(el('div', 'empty', '已经到底了'));
        } else {
          state.page++;
        }
        saveListState();
      })
      .catch(function (err) {
        if (state.page === 1) {
          grid.innerHTML = '';
          grid.appendChild(el('div', 'empty', '加载失败：' + err.message));
        }
      })
      .then(function () {
        state.loading = false;
        showProgress(false);
      });
  }

  /* ---------- 卡片渲染 ---------- */

  function renderCard(item) {
    var card = el('div', 'card');
    card.dataset.id = item.DataID;

    var cover = el('div', 'card-cover');

    var img = document.createElement('img');
    img.loading = 'lazy';
    img.decoding = 'async';
    img.alt = item.VID || '';
    img.src = withToken(item.SmallImageUrl || item.BigImageUrl);
    img.addEventListener('load', function () {
      img.classList.add('loaded');
      cover.classList.add('ready');
    });
    img.addEventListener('error', function () {
      // 短片等记录本来就没有封面图，显示占位而不是留白。
      // 用内联 SVG 而非外链，避免再产生一次 404。
      cover.classList.add('ready');
      img.style.display = 'none';
      var ph = el('div', 'cover-placeholder');
      ph.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">' +
        '<rect x="3" y="4" width="18" height="16" rx="2"/>' +
        '<circle cx="8.5" cy="9.5" r="1.5"/><path d="M21 16l-5-5-4 4-2-2-4 4"/></svg>';
      cover.appendChild(ph);
    });
    cover.appendChild(img);

    if (item.Tags && item.Tags.length) {
      var tags = el('div', 'card-tags');
      item.Tags.slice(0, 2).forEach(function (t) { tags.appendChild(el('span', 'tag', t)); });
      cover.appendChild(tags);
    }

    var info = el('div', 'card-info');

    // 显示名称：有识别码用识别码，否则退回标题，再否则用文件名。
    // 短片（文件名含中文的普通视频）没有识别码，直接显示"未知编号"没有意义。
    var primary = item.VID || item.Title || fileNameOf(item.FileName) || ('#' + item.DataID);
    var vidEl = el('div', 'card-vid', primary);
    // 有识别码时用等宽字体（形成对齐的列）；退回标题时用正常字体
    if (!item.VID) vidEl.classList.add('is-text');
    info.appendChild(vidEl);

    if (item.ReleaseDate) info.appendChild(el('div', 'card-date', item.ReleaseDate));
    // 有识别码时，标题作为第二行信息
    if (item.VID && item.Title) info.appendChild(el('div', 'card-title', item.Title));

    card.appendChild(cover);
    card.appendChild(info);

    /* 点击分区：
       封面 -> 直接播放（最常用操作，少一次跳转）
       文字区 -> 详情页（看简介、演员、多张截图）

       判断方式用「点是否落在封面元素内」，而不是靠 DOM 层级猜：
       - 绑在 cover 上的监听只能覆盖 cover 自己的盒模型，
         图片加载中/圆角/亚像素取整都会留下点不中的缝；
       - 用户点封面时应该 100% 是播放，不能因为点在图片边缘
         或角上就跳到详情页。
       所以统一绑在 card 上，用几何判断分区，并把整卡兜住，
       避免点空隙落到 #grid 上没有任何响应。 */
    card.addEventListener('click', function (e) {
      e.stopPropagation();
      // contains 判定：点中封面本身或封面的任一子元素（img、标签角标）
      var hitCover = cover.contains(e.target);
      if (hitCover) openPlayer(item.DataID);
      else openDetail(item.DataID);
    });

    return card;
  }

  /* ============================================================
     详情页

     入口：点击卡片的文字区（封面区是直接播放）。
     内容参考桌面版详情：标题、封面、发行信息、简介、类别、
     演员、内容截图、评分收藏、相似推荐。
     ============================================================ */

  var detailPage = document.getElementById('detailPage');
  var detailBody = document.getElementById('detailBody');
  var detailHeadVid = document.getElementById('detailHeadVid');
  var detailBackBtn = document.getElementById('detailBackBtn');
  var detailPlayTopBtn = document.getElementById('detailPlayTopBtn');

  // 当前详情页对应的数据，供顶部「播放」按钮使用
  var currentDetail = null;
  var detailClosingByBack = false;

  /**
   * 详情请求令牌。
   *
   * 快速连点两张卡片时，两个请求并发飞行，
   * 先发的可能后返回，把已经显示的新内容覆盖成旧的。
   * 每次请求自增令牌，回调里只认最新的那个。
   */
  var detailToken = 0;

  function openDetail(dataId) {
    // 是否「已在详情页内换片」——决定历史记录用 replace 还是 push。
    // 必须在加 show 类之前判断，否则条件永远为真。
    var alreadyOpen = detailPage.classList.contains('show');

    // 立刻清掉上一部的数据：请求失败时顶部「播放」按钮仍指向旧片，
    // 会让用户播放到完全不相关的视频。
    currentDetail = null;
    detailHeadVid.textContent = '加载中…';
    detailBody.innerHTML = '<div class="loading"><div class="spinner"></div>加载详情…</div>';
    detailPage.classList.add('show');

    // 只有首次打开才加锁。
    // 已打开时（详情页内换片）再加一次锁，关闭时只解一次，
    // 锁计数就永远归不了零，背景会永久无法滚动。
    if (!alreadyOpen) lockScroll();

    // 与播放页同理：压一条历史，手机返回键先关详情页。
    // 已在详情页内切换到另一部时用 replaceState，否则连点 N 个相似项
    // 会积压 N 条历史，用户要按 N 次返回才能退出。
    try {
      if (alreadyOpen) {
        history.replaceState({ detail: dataId }, '');
      } else {
        history.pushState({ detail: dataId }, '');
      }
    } catch (e) { /* 忽略 */ }

    var token = ++detailToken;

    apiFetch(API + '/api/video/' + dataId)
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(function (d) {
        // 期间又点了别的片子，这次的结果作废
        if (token !== detailToken) return;
        renderDetail(d);
      })
      .catch(function (err) {
        if (token !== detailToken) return;
        detailBody.innerHTML = '';
        detailBody.appendChild(el('div', 'empty', '加载失败：' + err.message));
      });
  }

  function closeDetail() {
    // 已经关掉了就不要重复解锁（连点返回按钮会触发两次）
    if (!detailPage.classList.contains('show'))
      return;

    detailPage.classList.remove('show');
    unlockScroll();

    // 让飞行中的详情请求作废，避免关闭后迟到响应又渲染进来
    detailToken++;

    if (detailClosingByBack) {
      detailClosingByBack = false;
    } else {
      try { history.back(); } catch (e) { /* 忽略 */ }
    }

  /**
   * 从详情页开始播放。

   * 关键：不能走 closeDetail()，因为它会 history.back()；
   * 紧接着 openPlayer() 又 pushState，形成「回退+前进」的组合，
   * 部分移动浏览器会因此丢失历史栈，返回键彻底失效。
   *
   * 正确做法：直接收起详情页的视觉层，把当前历史条目
   * 就地替换成播放页的，这样返回键仍然只退一层就回到列表。

  function playFromDetail() {
    if (!currentDetail) return;
    var id = currentDetail.DataID;

    // 只做视觉收起，不碰历史
    detailPage.classList.remove('show');
    unlockScroll();
    currentDetail = null;

    setTimeout(function () {
      openPlayer(id, true);   // replaceHistory=true：复用详情页那条历史
    }, 180);
  }

  /* 截图大图查看 */
  var shotViewer = null;
  function showShotViewer(url) {

      shotViewer = el('div', 'shot-viewer');
