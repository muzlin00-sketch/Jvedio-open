  /* ---------- 播放 ---------- */

  var currentVideo = null;

  /**
   * 播放请求令牌（同 detailToken 的道理）。
   * 换片/关闭时自增，让飞行中的旧请求失效。
   */
  var playerToken = 0;

  /**
   * 打开播放页。
   *
   * replaceHistory: 用当前历史条目替换而不是新增一条。
   * 从详情页跳转播放时传 true——详情页已经占了一条历史，
   * 再 push 会让返回键需要按两次才能回列表。
   */
  function openPlayer(dataId, replaceHistory) {
    playerVid.textContent = '加载中…';
    playerMeta.innerHTML = '';
    videoWrap.innerHTML = '<div class="loading" style="color:#8A8782"><div class="spinner"></div>打开中…</div>';
    playerPage.classList.add('show');
    lockScroll();

    // 压入一条历史记录，这样手机按「返回」是关闭播放页，
    // 而不是直接退出整个网站（原来没有 pushState，返回键行为完全不可控）。
    try {
      if (replaceHistory) {
        history.replaceState({ player: dataId }, '');
      } else {
        history.pushState({ player: dataId }, '');
      }
    } catch (e) { /* 某些环境禁用 history，忽略 */ }

    var token = ++playerToken;

    apiFetch(API + '/api/video/' + dataId)
      .then(function (r) { return r.json(); })
      .then(function (d) {
        // 期间已切到别的片子或关了播放页，这次结果作废
        if (token !== playerToken) return;
        renderPlayer(d);
      })
      .catch(function (err) {
        if (token !== playerToken) return;
        videoWrap.innerHTML = '';
        videoWrap.appendChild(el('div', 'player-error', '无法加载详情：' + err.message));
      });
  }

  /* ============================================================
     播放控件层
     ============================================================ */

  var ICON = {
    play: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>',
    pause: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>',
    back10: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9l5 4"/><path d="M6 9h7a5 5 0 015 5v1"/><text x="11" y="19" font-size="7" fill="currentColor" stroke="none">10</text></svg>',
    fwd10: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 5l5 4-5 4"/><path d="M18 9h-7a5 5 0 00-5 5v1"/><text x="6" y="19" font-size="7" fill="currentColor" stroke="none">10</text></svg>',
    full: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 00-2 2v3M16 3h3a2 2 0 012 2v3M8 21H5a2 2 0 01-2-2v-3M16 21h3a2 2 0 002-2v-3"/></svg>',
    exitFull: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3v3a2 2 0 01-2 2H3M16 3v3a2 2 0 002 2h3M8 21v-3a2 2 0 00-2-2H3M16 21v-3a2 2 0 012-2h3"/></svg>',
    close: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>',
  };

  function fmtTime(sec) {
    if (!isFinite(sec) || sec < 0) sec = 0;
    sec = Math.floor(sec);
    var h = Math.floor(sec / 3600);
    var m = Math.floor((sec % 3600) / 60);
    var s = sec % 60;
    var mm = (h > 0 && m < 10 ? '0' : '') + m;
    var ss = (s < 10 ? '0' : '') + s;
    return h > 0 ? h + ':' + mm + ':' + ss : mm + ':' + ss;
  }

  function buildControls(video, d) {
    var vc = el('div', 'vc');

    /* ---- 顶部：关闭 + 标题 ---- */
    var top = el('div', 'vc-top');
    var closeBtn = el('button', 'vc-close');
    closeBtn.type = 'button';
    closeBtn.innerHTML = ICON.close;
    closeBtn.setAttribute('aria-label', '关闭');
    closeBtn.addEventListener('click', function (e) {
      e.stopPropagation();
      closePlayer();
    });
    top.appendChild(closeBtn);
    top.appendChild(el('div', 'vc-title', d.VID || d.Title || fileNameOf(d.FileName) || ''));

    /* ---- 底部：进度条 + 按钮行 ---- */
    var bottom = el('div', 'vc-bottom');

    var prog = el('div', 'vc-progress');
    var track = el('div', 'vc-track');
    var buffer = el('div', 'vc-buffer');
    var played = el('div', 'vc-played');
    var thumb = el('div', 'vc-thumb');
    var bubble = el('div', 'vc-bubble', '00:00');
    track.appendChild(buffer);
    track.appendChild(played);
    track.appendChild(thumb);
    prog.appendChild(track);
    prog.appendChild(bubble);

    var row = el('div', 'vc-row');
    var playBtn = el('button', 'vc-btn play');
    playBtn.type = 'button';
    playBtn.innerHTML = ICON.play;
    var backBtn10 = el('button', 'vc-btn');
    backBtn10.type = 'button';
    backBtn10.innerHTML = ICON.back10;
    var fwdBtn10 = el('button', 'vc-btn');
    fwdBtn10.type = 'button';
    fwdBtn10.innerHTML = ICON.fwd10;

    var timeEl = el('div', 'vc-time');
    var curEl = el('span', null, '00:00');
    var sepEl = el('span', 'sep', '/');
    var durEl = el('span', null, '00:00');
    timeEl.appendChild(curEl);
    timeEl.appendChild(sepEl);
    timeEl.appendChild(durEl);

    var rateBtn = el('button', 'vc-rate', '1.0×');
    rateBtn.type = 'button';

    var fullBtn = el('button', 'vc-btn');
    fullBtn.type = 'button';
    fullBtn.innerHTML = ICON.full;

    row.appendChild(playBtn);
    row.appendChild(backBtn10);
    row.appendChild(fwdBtn10);
    row.appendChild(timeEl);
    row.appendChild(el('div', 'vc-spacer'));
    row.appendChild(rateBtn);
    row.appendChild(fullBtn);

    bottom.appendChild(prog);
    bottom.appendChild(row);

    /* ---- 中央播放按钮 + 加载圈 ---- */
    var center = el('button', 'vc-center');
    center.type = 'button';
    center.innerHTML = ICON.play;
    center.setAttribute('aria-label', '播放');

    var loading = el('div', 'vc-loading');
    loading.style.display = 'none';

    // 双击快进/快退的视觉反馈
    var skipL = el('div', 'vc-skip left', '« 10 秒');
    var skipR = el('div', 'vc-skip right', '10 秒 »');

    vc.appendChild(top);
    vc.appendChild(center);
    vc.appendChild(loading);
    vc.appendChild(skipL);
    vc.appendChild(skipR);
    vc.appendChild(bottom);
    videoWrap.appendChild(vc);

    /* ---------- 状态同步 ---------- */

    function setPlayIcon() {
      var playing = !video.paused && !video.ended;
      playBtn.innerHTML = playing ? ICON.pause : ICON.play;
      center.classList.toggle('hide', playing);
    }

    function updateProgress() {
      var dur = video.duration;
      var cur = video.currentTime;
      if (isFinite(dur) && dur > 0) {
        var pct = (cur / dur) * 100;
        played.style.width = pct + '%';
        thumb.style.left = pct + '%';
      }
      curEl.textContent = fmtTime(cur);
      durEl.textContent = isFinite(dur) ? fmtTime(dur) : '--:--';

      // 缓冲进度
      try {
        if (video.buffered.length > 0 && isFinite(dur) && dur > 0) {
          var end = video.buffered.end(video.buffered.length - 1);
          buffer.style.width = Math.min(100, (end / dur) * 100) + '%';
        }
      } catch (e) { /* 忽略 */ }
    }

    /* ---------- 事件绑定 ---------- */

    video.addEventListener('timeupdate', updateProgress);
    video.addEventListener('progress', updateProgress);
    video.addEventListener('loadedmetadata', function () {
      updateProgress();
      durEl.textContent = fmtTime(video.duration);
    });
    video.addEventListener('play', setPlayIcon);
    video.addEventListener('pause', setPlayIcon);
    video.addEventListener('ended', setPlayIcon);

    video.addEventListener('waiting', function () { loading.style.display = 'block'; });
    video.addEventListener('playing', function () { loading.style.display = 'none'; });
    video.addEventListener('canplay', function () { loading.style.display = 'none'; });

    function togglePlay() {
      if (video.paused) video.play().catch(function () {});
      else video.pause();
    }

    playBtn.addEventListener('click', function (e) { e.stopPropagation(); togglePlay(); });
    center.addEventListener('click', function (e) { e.stopPropagation(); togglePlay(); });

    function seekBy(delta) {
      var t = Math.max(0, Math.min(video.duration || 0, video.currentTime + delta));
      video.currentTime = t;
      updateProgress();
    }
    backBtn10.addEventListener('click', function (e) { e.stopPropagation(); seekBy(-10); });
    fwdBtn10.addEventListener('click', function (e) { e.stopPropagation(); seekBy(10); });

    /* ---- 进度条拖动（鼠标 + 触摸统一用 Pointer 事件）---- */

    var dragging = false;

    function posToTime(clientX) {
      var rect = track.getBoundingClientRect();
      var ratio = (clientX - rect.left) / rect.width;
      ratio = Math.max(0, Math.min(1, ratio));
      return ratio * (video.duration || 0);
    }

    function showBubble(clientX, time) {
      var rect = track.getBoundingClientRect();
      bubble.textContent = fmtTime(time);
      bubble.style.left = (clientX - rect.left) + 'px';
    }

    prog.addEventListener('pointerdown', function (e) {
      if (!isFinite(video.duration) || video.duration <= 0) return;
      dragging = true;
      prog.classList.add('dragging');
      try { prog.setPointerCapture(e.pointerId); } catch (err) { }
      var t = posToTime(e.clientX);
      showBubble(e.clientX, t);
      video.currentTime = t;
      updateProgress();
      e.preventDefault();
    });

    prog.addEventListener('pointermove', function (e) {
      if (!isFinite(video.duration) || video.duration <= 0) return;
      var t = posToTime(e.clientX);
      if (dragging) {
        showBubble(e.clientX, t);
        video.currentTime = t;
        updateProgress();
      }
    });

    function endDrag(e) {
      if (!dragging) return;
      dragging = false;
      prog.classList.remove('dragging');
      try { prog.releasePointerCapture(e.pointerId); } catch (err) { }
    }
    prog.addEventListener('pointerup', endDrag);
    prog.addEventListener('pointercancel', endDrag);

    /* ---- 点击 / 双击手势 ----
       单击：切换控件显隐（300ms 延迟，等双击判定）
       双击左/右半屏：快退 / 快进 10 秒
       这是 YouTube / B站 移动端的通用交互，两者可以共存，
       代价只是单击响应慢 300ms，用户几乎无感。
    */
    var tapTimer = null;
    var lastTapTime = 0;
    var lastTapX = 0;

    function flashSkip(node) {
      node.classList.add('show');
      setTimeout(function () { node.classList.remove('show'); }, 550);
    }

    video.addEventListener('click', function (e) {
      // 刚完成一次横向滑动：浏览器仍会补发 click，
      // 不拦掉会导致滑动结束后控件莫名切换显隐
      if (Date.now() - swipe.lastEndAt < 350) return;

      var now = Date.now();
      var rect = video.getBoundingClientRect();
      var x = e.clientX - rect.left;

      var isDouble = (now - lastTapTime < 300) && Math.abs(x - lastTapX) < 70;

      if (isDouble) {
        // 双击：取消待执行的单击动作，直接快进/快退
        clearTimeout(tapTimer);
        lastTapTime = 0;
        if (x < rect.width / 2) {
          seekBy(-10);
          flashSkip(skipL);
        } else {
          seekBy(10);
          flashSkip(skipR);
        }
        return;
      }

      lastTapTime = now;
      lastTapX = x;

      // 单击：延迟 300ms 执行，期间若来了第二击就作废。
      //
      // 判据必须用「按下那一刻」的快照，不能用执行时的 uiVisible：
      // 手机上一次点击会连带触发一串合成事件（pointerdown -> mousemove -> click），
      // mousemove 会先调 showUi() 把 uiVisible 改成 true，
      // 300ms 后这里再读就是 true，于是「想唤出」变成「收起」——
      // 表现就是控件隐藏后怎么点都唤不出来。
      clearTimeout(tapTimer);
      tapTimer = setTimeout(function () {
        if (uiVisibleAtTap) hideUi();
        else showUi();
      }, 300);
    });

    // 记录按下瞬间的显隐状态，供上面的单击切换使用。
    // pointerdown 一定早于合成出来的 mousemove / click。
    //
    // 判据直接读 DOM 上的 hidden 类，而不是读 uiVisible 变量：
    // 原生全屏（浏览器自带的全屏按钮）进出时，浏览器会自己改视频层的显示，
    // 变量和 DOM 会不同步，读 DOM 永远是对的。
    function snapshotUiVisible() {
      uiVisibleAtTap = !vc.classList.contains('hidden');
    }
    video.addEventListener('pointerdown', function () {
      snapshotUiVisible();
    });
    video.addEventListener('touchstart', function () {
      snapshotUiVisible();
    }, { passive: true });

    /* ---- 横向滑动快进 / 快退 ----
       这是 B站 / 抖音 移动端的核心手势：按住画面左右滑，
       松手才真正跳转。

       关键设计（不是随便定个系数）：

       1. 滑动量按「屏幕宽度 = 全片时长」映射。
          如果按固定像素换算（比如每秒 10px），2 小时的片滑满屏
          只走 40 秒，而 20 分钟的片滑满屏能走完全片 —— 手感完全不同。
          按比例映射后，任何长度的片子滑满屏都是一整段，符合直觉。

       2. 拖动中只改预览，不动 video.currentTime。
          每帧改 currentTime 会不断触发 seek、反复解码，
          手机上表现为卡顿甚至花屏。松手才 seek 一次。

       3. 只有水平位移明显大于垂直位移才判定为横向滑动。
          否则会和页面滚动、上滑下拉手势打架。

       4. 滑动中禁用 UI 显隐，避免松手瞬间控件闪一下。
    */

    var swipe = {
      active: false,
      decided: false,     // 是否已判定为横向滑动
      startX: 0,
      startY: 0,
      startTime: 0,
      targetTime: 0,
      pointerId: null,
      lastEndAt: 0        // 上次滑动结束时间，用于抑制随后的 click
    };

    // 横向位移超过这个像素才开始判定，避免轻点被当成滑动
    var SWIPE_THRESHOLD = 12;

    var swipeTip = el('div', 'vc-swipe-tip');
    var swipeTipTime = el('div', 'vc-swipe-tip-time', '00:00');
    var swipeTipDelta = el('div', 'vc-swipe-tip-delta', '');
    swipeTip.appendChild(swipeTipTime);
    swipeTip.appendChild(swipeTipDelta);
    vc.appendChild(swipeTip);

    function swipeBegin(e) {
      if (!isFinite(video.duration) || video.duration <= 0) return;
      var p = e.touches ? e.touches[0] : e;
      swipe.active = true;
      swipe.decided = false;
      swipe.startX = p.clientX;
      swipe.startY = p.clientY;
      swipe.startTime = video.currentTime;
      swipe.targetTime = video.currentTime;
      swipe.pointerId = e.pointerId;
    }

    function swipeMove(e) {
      if (!swipe.active) return;
      var p = e.touches ? e.touches[0] : e;
      var dx = p.clientX - swipe.startX;
      var dy = p.clientY - swipe.startY;

      // 还没判定方向：等位移够大再决定
      if (!swipe.decided) {
        if (Math.abs(dx) < SWIPE_THRESHOLD && Math.abs(dy) < SWIPE_THRESHOLD) return;
        // 垂直方向更大 → 不是横向滑动，交还给页面
        if (Math.abs(dy) > Math.abs(dx)) {
          swipe.active = false;
          return;
        }
        swipe.decided = true;
        vc.classList.add('swiping');
        showUi();
      }

      e.preventDefault();

      // 屏幕宽度 = 全片时长
      var rect = video.getBoundingClientRect();
      var deltaSec = (dx / rect.width) * video.duration;
      var t = swipe.startTime + deltaSec;
      t = Math.max(0, Math.min(video.duration, t));
      swipe.targetTime = t;

      // 只更新预览
      var sign = t >= swipe.startTime ? '+' : '-';
      var diff = Math.abs(Math.round(t - swipe.startTime));
      swipeTipTime.textContent = fmtTime(t) + ' / ' + fmtTime(video.duration);
      swipeTipDelta.textContent = sign + fmtTime(diff);
      swipeTipDelta.className = 'vc-swipe-tip-delta ' + (sign === '+' ? 'fwd' : 'back');
      swipeTip.classList.add('show');

      // 预览进度条跟着走
      played.style.width = (t / video.duration) * 100 + '%';
      thumb.style.left = (t / video.duration) * 100 + '%';
      curEl.textContent = fmtTime(t);
    }

    function swipeEnd(e) {
      if (!swipe.active) return;
      var wasSwiping = swipe.decided;
      swipe.active = false;
      swipe.decided = false;
      vc.classList.remove('swiping');

      if (!wasSwiping) {
        // 没达到滑动判定，当作普通点击处理
        return;
      }

      swipe.lastEndAt = Date.now();
      swipeTip.classList.remove('show');
      // 松手才真正 seek，只跳一次
      video.currentTime = swipe.targetTime;
      updateProgress();
      // 滑完让控件自动淡出，符合"手势优先"的沉浸感
      clearTimeout(tapTimer);
      tapTimer = setTimeout(function () { hideUi(); }, 900);
    }

    // 触摸与鼠标都支持；桌面端按住拖动也能用
    if (window.PointerEvent) {
      video.addEventListener('pointerdown', swipeBegin);
      video.addEventListener('pointermove', swipeMove, { passive: false });
      video.addEventListener('pointerup', swipeEnd);
      video.addEventListener('pointercancel', swipeEnd);
    } else {
      video.addEventListener('touchstart', swipeBegin, { passive: true });
      video.addEventListener('touchmove', swipeMove, { passive: false });
      video.addEventListener('touchend', swipeEnd);
      video.addEventListener('mousedown', swipeBegin);
      video.addEventListener('mousemove', swipeMove);
      video.addEventListener('mouseup', swipeEnd);
    }

    /* ---- 倍速 ---- */
    var RATES = [1, 1.25, 1.5, 2, 0.75];
    var rateIdx = 0;
    rateBtn.addEventListener('click', function (e) {
      e.stopPropagation();
      rateIdx = (rateIdx + 1) % RATES.length;
      video.playbackRate = RATES[rateIdx];
      rateBtn.textContent = RATES[rateIdx].toFixed(2).replace(/0$/, '') + '×';
    });

    /* ---- 全屏 ----
       用 Fullscreen API 让 video-wrap 铺满；不支持时退回视频元素原生全屏（iOS 兜底）。
       注意：手机浏览器自带的「快捷全屏」（地址栏/系统手势那套）和页面自定义控件不兼容，
       那是浏览器行为，页面改不了；页面内的全屏按钮走的就是下面这套，正常。
    */
    function isFullscreen() {
      return document.fullscreenElement || document.webkitFullscreenElement;
    }

    fullBtn.addEventListener('click', function (e) {
      e.stopPropagation();
      if (isFullscreen()) {
        if (document.exitFullscreen) document.exitFullscreen();
        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
      } else {
        var target = videoWrap;
        if (target.requestFullscreen) target.requestFullscreen();
        else if (target.webkitRequestFullscreen) target.webkitRequestFullscreen();
        else if (video.webkitEnterFullscreen) video.webkitEnterFullscreen(); // iOS 兜底
      }
    });

    document.addEventListener('fullscreenchange', function () {
      fullBtn.innerHTML = isFullscreen() ? ICON.exitFull : ICON.full;
    });

    /* ---- 控件显隐 ----
       桌面：鼠标在播放器上移动 -> 自动浮现，静止 3.5 秒后淡出
       手机：点击屏幕 -> 浮现；再点一下 -> 收起
    */
    var uiVisible = true;
    var hideTimer = null;

    // 点击切换控件显隐时用的「按下前」状态快照（见单击处理里的说明）
    var uiVisibleAtTap = true;

    function showUi() {
      uiVisible = true;
      vc.classList.remove('hidden');
      clearTimeout(hideTimer);
      // 只在播放中自动隐藏；暂停时保持可见，方便操作
      if (!video.paused) {
        hideTimer = setTimeout(hideUi, 3500);
      }
    }

    function hideUi() {
      uiVisible = false;
      vc.classList.add('hidden');
      clearTimeout(hideTimer);
    }

    // 鼠标移动：整个播放区域都算，不要求正好压在控件上。
    //
    // 这里保持「一动就唤出」：单击切换用的是 pointerdown 时的状态快照，
    // 所以 mousemove 提前唤出不会把「点一下唤出」变成「点一下收起」。
    videoWrap.addEventListener('mousemove', function () {
      showUi();
    });
    videoWrap.addEventListener('mouseleave', function () {
      if (!video.paused) hideUi();
    });

    // 任何控件交互都重置隐藏计时
    vc.addEventListener('pointerdown', showUi);

    video.addEventListener('play', showUi);
    video.addEventListener('pause', function () {
      clearTimeout(hideTimer);
      showUi();
    });

    // 初始化
    setPlayIcon();
    updateProgress();
    showUi();
  }

  function renderPlayer(d) {
    currentVideo = d;
    playerVid.textContent = d.VID || d.Title || fileNameOf(d.FileName) || ('#' + d.DataID);

    // 播放器
    videoWrap.innerHTML = '';
    if (!d.Playable) {
      videoWrap.appendChild(el('div', 'player-error', '文件不存在或无法访问'));
    } else {
      var video = document.createElement('video');
      // 关键：不启用原生 controls，改用自写控件层。
      // 原生控件在移动端全屏后会自动隐藏，进度条随之消失，无法快进。
      video.controls = false;
      video.autoplay = true;
      video.playsInline = true;
      video.setAttribute('playsinline', '');
      video.setAttribute('webkit-playsinline', '');
      video.setAttribute('x5-playsinline', '');
      video.preload = 'metadata';
      video.src = withToken(API + d.StreamUrl);
      video.addEventListener('error', function () {
        var box = el('div', 'player-error');
        box.innerHTML = '这个格式浏览器可能不支持。<br>如果是 .wmv / .avi 等格式，需要服务端转码。';
        videoWrap.appendChild(box);
      });
      // 开始播放时记一次观看（写 ViewCount / ViewDate，桌面端「最近播放」依赖它）
      video.addEventListener('playing', function once() {
        video.removeEventListener('playing', once);
        markWatched(d.DataID);
      });
      videoWrap.appendChild(video);
      buildControls(video, d);
    }

    // 元信息
    playerMeta.innerHTML = '';
    if (d.Title) playerMeta.appendChild(el('div', 'player-title', d.Title));

    // 评分 + 收藏
    playerMeta.appendChild(buildActions(d));

    var row = el('div', 'meta-row');
    if (d.ReleaseDate) row.appendChild(el('span', 'meta-chip', d.ReleaseDate));
    if (d.Duration) row.appendChild(el('span', 'meta-chip', formatDuration(d.Duration)));
    if (d.Size) row.appendChild(el('span', 'meta-chip', formatSize(d.Size)));
    if (d.Director) row.appendChild(el('span', 'meta-chip', '导演 ' + d.Director));
    if (d.Studio) row.appendChild(el('span', 'meta-chip', d.Studio));
    playerMeta.appendChild(row);

    if (d.Actors && d.Actors.length) {
      var ar = el('div', 'meta-row');
      d.Actors.forEach(function (a) { ar.appendChild(el('span', 'meta-chip', a)); });
      playerMeta.appendChild(ar);
    }
    if (d.Genres && d.Genres.length) {
      var gr = el('div', 'meta-row');
      d.Genres.slice(0, 8).forEach(function (g) { gr.appendChild(el('span', 'meta-chip', g)); });
      playerMeta.appendChild(gr);
    }

    // 相似推荐（异步加载，不阻塞播放）
    var similarBox = el('div', 'similar-section');
    playerMeta.appendChild(similarBox);
    loadSimilar(d.DataID, similarBox);
  }

  /**
   * 构建评分与收藏控件。
   *
   * 桌面端把「我的收藏」定义为 Grade > 0，
   * 所以这里的「收藏」按钮本质是「打 5 星」，两者共用同一个字段。
   * 这样手机端点收藏，桌面端立刻能看到，数据完全一致。
   */
  function buildActions(d) {
    var wrap = el('div', 'actions-row');

    var starRow = el('div', 'star-row');
    var ratingText = el('span', 'rating-text');

    var current = d.Grade || 0;

    function paint(grade) {
      current = grade;
      Array.prototype.forEach.call(starRow.querySelectorAll('.star'), function (s, i) {
        s.classList.toggle('on', grade >= i + 1);
      });
      ratingText.textContent = grade > 0 ? grade.toFixed(1) + ' 星' : '未评分';
      favBtn.classList.toggle('on', grade > 0);
    }

    for (var i = 1; i <= 5; i++) {
      (function (n) {
        var star = el('button', 'star');
        star.type = 'button';
        star.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.9 6.3 6.9.8-5.1 4.7 1.4 6.8L12 17.3 5.9 20.6l1.4-6.8L2.2 9.1l6.9-.8L12 2z"/></svg>';
        star.addEventListener('click', function () {
          // 点当前星级 = 取消（归零），符合直觉
          var next = (current === n) ? 0 : n;
          setGrade(d.DataID, next, paint);
        });
        starRow.appendChild(star);
      })(i);
    }
    starRow.appendChild(ratingText);

    var favBtn = el('button', 'fav-btn');
    favBtn.type = 'button';
    favBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-8-5.1-8-11a4.6 4.6 0 018-3 4.6 4.6 0 018 3c0 5.9-8 11-8 11z"/></svg><span>收藏</span>';
    favBtn.addEventListener('click', function () {
      var next = current > 0 ? 0 : 5;   // 未收藏则打满 5 星，已收藏则取消
      setGrade(d.DataID, next, paint);
    });

    paint(current);

    wrap.appendChild(starRow);
    wrap.appendChild(favBtn);
    return wrap;
  }

  function closePlayer() {
    // 已关闭就不重复执行：连点关闭按钮会解锁两次，导致锁计数为负
    if (!playerPage.classList.contains('show'))
      return;

    // 退出播放页时若还在投屏，一并停止。
    // 否则投影仪会继续播放，而手机上已经没有任何入口能控制它。
    if (castCurrent) {
      try {
        apiFetch(API + '/api/cast/stop', { method: 'POST' });
      } catch (e) { /* 忽略 */ }
      castCurrent = null;
      castBtn.classList.remove('on');
      if (castTimer) { clearInterval(castTimer); castTimer = null; }
      if (castCleanup) { castCleanup(); castCleanup = null; }
    }

    // 先让界面立即响应，再做资源释放。
    // 顺序很重要：某些移动浏览器在释放解码资源时会短暂卡顿，
    // 如果先释放再切界面，用户会看到"点了没反应"。
    playerPage.classList.remove('show');
    unlockScroll();

    // 让飞行中的详情请求作废：否则关闭后迟到的响应会往
    // 已清空的 videoWrap 里塞回一个播放器，表现为「关了又自己打开」。
    playerToken++;

    // 主动点关闭时，要把 openPlayer 压入的历史记录回退掉，
    // 否则浏览器的返回栈里会残留一条，导致返回键要按两次。
    if (!playerClosingByBack) {
      try {
        history.back();
      } catch (e) { /* 忽略 */ }
    }
    playerClosingByBack = false;

    var video = videoWrap.querySelector('video');

    // 用一个宏任务把释放动作推迟到界面重绘之后，
    // 这样即使 releaseVideo 卡顿，界面已经先关掉了。
    setTimeout(function () {
      releaseVideo(video);
      videoWrap.innerHTML = '';
      currentVideo = null;
    }, 0);
  }

  /* ============================================================
     投屏（DLNA）
     ============================================================ */

  var castDevices = [];
  var castCurrent = null;    // 当前投屏到的设备名

  /**
   * 打开投屏面板并搜索设备。
   *
   * 搜索要 2 秒左右，所以先开面板显示「正在搜索」，
   * 不要让用户点了按钮之后界面毫无反应。
   */
  function openCastSheet() {
    castMask.classList.add('show');
    castSheet.classList.add('show');
    lockScroll();
    searchCastDevices(false);
  }

  function closeCastSheet() {
    castMask.classList.remove('show');
    castSheet.classList.remove('show');
    unlockScroll();
  }

  function searchCastDevices(forceRefresh) {
    castTip.textContent = '正在搜索局域网内的投影仪…';
    castTip.style.display = '';
    castList.innerHTML = '';
    castRefresh.classList.add('spinning');

    var url = API + '/api/cast/devices' + (forceRefresh ? '?refresh=1' : '');
    apiFetch(url)
      .then(function (r) { return r.json(); })
      .then(function (data) {
        castDevices = data.Items || [];
        castCurrent = data.current || null;
        renderCastList();
      })
      .catch(function (err) {
        castTip.textContent = '搜索失败：' + err.message;
      })
      .then(function () {
        castRefresh.classList.remove('spinning');
      });
  }

  function renderCastList() {
    castList.innerHTML = '';

    if (!castDevices.length) {
      castTip.style.display = '';
      castTip.textContent = '没找到可投屏的设备。请确认投影仪已开机、和电脑连的是同一个 WiFi。';
      return;
    }

    castTip.style.display = 'none';

    castDevices.forEach(function (d) {
      var item = el('div', 'cast-item' + (d.Name === castCurrent ? ' on' : ''));

      var icon = el('div', 'cast-item-icon');
      icon.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">' +
        '<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8"/><path d="M12 16v4"/></svg>';
      item.appendChild(icon);

      var main = el('div', 'cast-item-main');
      main.appendChild(el('div', 'cast-item-name', d.Name));
      main.appendChild(el('div', 'cast-item-sub', d.Model || d.Ip));
      item.appendChild(main);

      if (d.Name === castCurrent) {
        item.appendChild(el('div', 'cast-item-state', '投屏中'));
      }

      item.addEventListener('click', function () { doCast(d.Name); });
      castList.appendChild(item);
    });
  }

  /**
   * 开始投屏。
   *
   * 成功后不关播放页，而是把播放页切成「遥控器」形态：
   * 投屏时画面在投影仪上，手机就成了遥控器——如果直接关掉播放页，
   * 用户就没有进度条、没法快进暂停，只能跑回投影仪按遥控器。
   */
  function doCast(deviceName) {
    // 播放页用 currentVideo，详情页用 currentDetail，两个入口都要能投
    var d = currentVideo || currentDetail;
    if (!d) return;

    castTip.style.display = '';
    castTip.textContent = '正在连接 ' + deviceName + '…';

    apiFetch(API + '/api/cast/play/' + d.DataID + '?device=' + encodeURIComponent(deviceName), {
      method: 'POST'
    })
      .then(function (r) {
        return r.json().then(function (j) {
          if (!r.ok) throw new Error(j.error || ('HTTP ' + r.status));
          return j;
        });
      })
      .then(function (j) {
        castCurrent = j.device;
        castBtn.classList.add('on');
        closeCastSheet();

        // 从详情页投屏时播放页是关着的，要先把播放页打开，
        // 否则没有遥控界面可用（用户只能在投影仪那边按遥控器）。
        if (!playerPage.classList.contains('show')) {
          var target = currentVideo || currentDetail;
          if (target) {
            // 详情页 z-index(210) 高于播放页(200)，不清掉它的 show
            // 就会盖在遥控界面上面，用户看到的还是详情页。
            var fromDetail = detailPage.classList.contains('show');
            if (fromDetail) {
              detailPage.classList.remove('show');
              unlockScroll();
            }

            enterCastMode(j.device, target);
            playerPage.classList.add('show');
            lockScroll();

            // 从详情页进来时替换历史（和 playFromDetail 一致），
            // 否则返回键要按两次才能回首页。
            try {
              if (fromDetail) history.replaceState({ page: 'player' }, '');
              else history.pushState({ page: 'player' }, '');
            } catch (e) { /* 忽略 */ }
          }
        } else {
          enterCastMode(j.device, currentVideo || currentDetail);
        }
        toast('已投屏到 ' + j.device);
      })
      .catch(function (err) {
        castTip.textContent = '投屏失败：' + err.message;
      });
  }

  /* ---------- 投屏遥控界面 ---------- */

  var castTimer = null;
  var castDuration = 0;     // 秒
  var castPosition = 0;     // 秒
  var castCleanup = null;   // 退出投屏界面时解绑拖拽监听

  /**
   * 把播放页切成遥控形态。
   *
   * 用 DOM 直接替换 videoWrap 的内容：原来这里是个 &lt;video&gt;，
   * 投屏后本机不再解码，必须显式释放，否则手机一直在后台
   * 拉流、耗电、还和投影仪抢带宽。
   */
  function enterCastMode(deviceName, videoData) {
    // 上一次投屏的拖拽监听先解绑，避免重复叠加
    if (castCleanup) { castCleanup(); castCleanup = null; }

    // 记下正在投的片子，停止投屏时用它恢复本机播放
    currentVideo = videoData || currentVideo;

    // 播放页标题同步（从详情页投屏时播放页是刚打开的，标题还是空的）
    if (currentVideo) {
      playerVid.textContent = currentVideo.VID || currentVideo.Title
        || fileNameOf(currentVideo.FileName) || ('#' + currentVideo.DataID);
    }

    // 释放本机播放器
    var old = videoWrap.querySelector('video');
    if (old) releaseVideo(old);
    videoWrap.innerHTML = '';

    var panel = el('div', 'cast-panel');

    var ring = el('div', 'cast-panel-ring');
    ring.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' +
      '<path d="M2 17.5a2 2 0 012.5 2M2 13.5a6 6 0 016 6M2 9.5a10 10 0 0110 10"/>' +
      '<path d="M9.5 3.5H19a2 2 0 012 2v10a2 2 0 01-2 2h-2.5"/></svg>';
    panel.appendChild(ring);

    panel.appendChild(el('div', 'cast-panel-device', deviceName));

    var stateEl = el('div', 'cast-panel-state', '正在连接…');
    panel.appendChild(stateEl);

    // 进度条
    var prog = el('div', 'cast-progress');
    var track = el('div', 'cast-progress-track');
    var bar = el('div', 'cast-progress-bar');
    // 拖拽把手：视觉上是个小圆点，实际触摸区靠 track 的加大 padding
    var knob = el('div', 'cast-progress-knob');
    bar.appendChild(knob);
    track.appendChild(bar);
    prog.appendChild(track);

    var times = el('div', 'cast-progress-time');
    var curEl = el('span', null, '00:00');
    var durEl = el('span', null, '00:00');
    times.appendChild(curEl);
    times.appendChild(el('span', 'cast-progress-sep', '/'));
    times.appendChild(durEl);
    prog.appendChild(times);
    panel.appendChild(prog);

    // 控制按钮
    var row = el('div', 'cast-controls');
    var backBtnEl = castButton(ICON.back10);
    var toggleEl = castButton(ICON.pause);
    var fwdBtnEl = castButton(ICON.fwd10);
    row.appendChild(backBtnEl);
    row.appendChild(toggleEl);
    row.appendChild(fwdBtnEl);
    panel.appendChild(row);

    var stopBtn = el('button', 'cast-disconnect', '停止投屏');
    stopBtn.type = 'button';
    panel.appendChild(stopBtn);

    videoWrap.appendChild(panel);

    var playing = true;

    backBtnEl.addEventListener('click', function () { castSeekBy(-10); });
    fwdBtnEl.addEventListener('click', function () { castSeekBy(10); });
    toggleEl.addEventListener('click', function () {
      var action = playing ? 'pause' : 'resume';
      apiFetch(API + '/api/cast/' + action, { method: 'POST' })
        .then(function () {
          playing = !playing;
          toggleEl.innerHTML = playing ? ICON.pause : ICON.play;
          stateEl.textContent = playing ? '正在播放' : '已暂停';
        })
        .catch(function () { /* 忽略 */ });
    });
    stopBtn.addEventListener('click', function () { stopCast(); });

    /* ---------- 进度条拖拽 ---------- */

    var dragging = false;
    var dragTarget = 0;      // 拖拽中预计要跳到的秒数

    /**
     * 根据手指/鼠标位置算出目标秒数。
     */
    function posFromEvent(e) {
      var rect = track.getBoundingClientRect();
      var x = (e.touches && e.touches.length) ? e.touches[0].clientX : e.clientX;
      var ratio = (x - rect.left) / rect.width;
      if (ratio < 0) ratio = 0;
      if (ratio > 1) ratio = 1;
      return Math.round(ratio * castDuration);
    }

    /**
     * 拖拽中只更新界面，不发请求。
     *
     * 拖动时如果每一帧都发 Seek，投影仪会收到几十条指令，
     * 卡住甚至断开——这是 DLNA 投屏拖动最常见的错误做法。
     * 正确做法：拖动时本地预览，松手才发一次。
     */
    function applyDragPreview(sec) {
      dragTarget = sec;
      var ratio = castDuration > 0 ? sec / castDuration : 0;
      bar.style.width = (ratio * 100) + '%';
      curEl.textContent = fmtTime(sec);
    }

    function onDragStart(e) {
      if (castDuration <= 0) return;    // 还没拿到总时长，无法定位
      dragging = true;
      track.classList.add('dragging');
      applyDragPreview(posFromEvent(e));
      e.preventDefault();
    }

    function onDragMove(e) {
      if (!dragging) return;
      applyDragPreview(posFromEvent(e));
      e.preventDefault();
    }

    function onDragEnd(e) {
      if (!dragging) return;
      dragging = false;
      track.classList.remove('dragging');

      var target = dragTarget;
      castPosition = target;
      castSeekTo(target);
      if (e && e.cancelable) e.preventDefault();
    }

    // 用 Pointer Events 一套代码兼容鼠标和触摸；
    // 不支持时退回 mouse + touch 两套。
    //
    // move/up 挂在 window 上：手指拖出进度条范围也能继续拖。
    // 但必须能解绑，否则每次进投屏页都会多叠一份监听，
    // 拖一次进度条会发出 N 次 seek。
    var dragEvents = window.PointerEvent
      ? ['pointerdown', 'pointermove', 'pointerup', 'pointercancel']
      : ['mousedown', 'mousemove', 'mouseup', null];

    track.addEventListener(dragEvents[0], onDragStart, { passive: false });
    window.addEventListener(dragEvents[1], onDragMove, { passive: false });
    window.addEventListener(dragEvents[2], onDragEnd);
    if (dragEvents[3]) window.addEventListener(dragEvents[3], onDragEnd);

    // 非 Pointer 环境额外补 touch（手机浏览器大多支持 Pointer，
    // 但老版安卓 WebView 只认 touch）
    var useTouch = !window.PointerEvent;
    if (useTouch) {
      track.addEventListener('touchstart', onDragStart, { passive: false });
      window.addEventListener('touchmove', onDragMove, { passive: false });
      window.addEventListener('touchend', onDragEnd);
    }

    // 面板被替换或销毁时解绑，避免监听泄漏
    castCleanup = function () {
      track.removeEventListener(dragEvents[0], onDragStart);
      window.removeEventListener(dragEvents[1], onDragMove);
      window.removeEventListener(dragEvents[2], onDragEnd);
      if (dragEvents[3]) window.removeEventListener(dragEvents[3], onDragEnd);
      if (useTouch) {
        window.removeEventListener('touchmove', onDragMove);
        window.removeEventListener('touchend', onDragEnd);
      }
      dragging = false;
    };

    // 轮询状态。
    // 间隔 2 秒：DLNA 是请求-应答协议，每次查询约 100-300ms，
    // 查太勤会把投影仪的控制端口压满，反而卡顿。
    function poll() {
      if (!castCurrent) return;
      // 拖拽期间跳过：轮询回来的旧位置会把用户正在拖的进度条拽回去
      if (dragging) return;
      apiFetch(API + '/api/cast/status')
        .then(function (r) { return r.json(); })
        .then(function (s) {
          castPosition = parseTime(s.position);
          castDuration = parseTime(s.duration);

          if (s.duration && s.duration !== '00:00:00') durEl.textContent = fmtTime(castDuration);
          curEl.textContent = fmtTime(castPosition);

          if (castDuration > 0) {
            bar.style.width = Math.min(100, (castPosition / castDuration) * 100) + '%';
          }

          if (s.state === 'PLAYING') {
            playing = true;
            toggleEl.innerHTML = ICON.pause;
            stateEl.textContent = '正在播放';
          } else if (s.state === 'PAUSED_PLAYBACK') {
            playing = false;
            toggleEl.innerHTML = ICON.play;
            stateEl.textContent = '已暂停';
          } else if (s.state === 'STOPPED') {
            stateEl.textContent = '已停止';
          }
        })
        .catch(function () { /* 单次失败不影响后续 */ });
    }

    poll();
    if (castTimer) clearInterval(castTimer);
    castTimer = setInterval(poll, 2000);
  }

  function castButton(iconHtml) {
    var b = el('button', 'cast-ctrl-btn');
    b.type = 'button';
    b.innerHTML = iconHtml;
    return b;
  }

  /**
   * 相对跳转。
   *
   * DLNA 的 Seek 只接受**绝对时间**，没有「快进 10 秒」这种动作，
   * 所以必须自己拿当前进度加上去再发。
   * 这也是进度需要轮询的原因之一：不快门知道当前位置就没法跳。
   */
  function castSeekBy(delta) {
    var target = castPosition + delta;
    if (target < 0) target = 0;
    if (castDuration > 0 && target > castDuration) target = castDuration;
    castSeekTo(target, (delta > 0 ? '快进 ' : '后退 ') + Math.abs(delta) + ' 秒');
  }

  /**
   * 跳到绝对位置（拖拽松手时用）。
   * @param seconds 目标秒数
   * @param tip     可选，成功后的提示文案；不传则提示跳转时间
   */
  function castSeekTo(seconds, tip) {
    var target = Math.max(0, Math.floor(seconds));
    if (castDuration > 0 && target > castDuration) target = castDuration;

    apiFetch(API + '/api/cast/seek?seconds=' + target, { method: 'POST' })
      .then(function () {
        castPosition = target;
        toast(tip || ('已跳到 ' + fmtTime(target)));
      })
      .catch(function () { /* 忽略 */ });
  }

  /** "00:12:34" / "12:34" -> 秒 */
  function parseTime(s) {
    if (!s) return 0;
    var parts = String(s).split(':');
    var sec = 0;
    for (var i = 0; i < parts.length; i++) {
      sec = sec * 60 + (parseInt(parts[i], 10) || 0);
    }
    return sec;
  }

  /**
   * 停止投屏并恢复本机播放界面。
   */
  function stopCast() {
    // 界面恢复不依赖后端成败：
    // 后端可能因为服务重启、网络抖动而失败，但用户点了「停止投屏」
    // 就必须退出投屏界面，否则会卡在遥控页没法操作。
    function restoreLocal() {
      castCurrent = null;
      castBtn.classList.remove('on');
      if (castTimer) { clearInterval(castTimer); castTimer = null; }
      if (castCleanup) { castCleanup(); castCleanup = null; }
      videoWrap.innerHTML = '';
      var d = currentVideo || currentDetail;
      if (d) renderPlayer(d);
    }

    apiFetch(API + '/api/cast/stop', { method: 'POST' })
      .then(function () {
        restoreLocal();
        toast('已停止投屏');
      })
      .catch(function () {
        restoreLocal();
        toast('已断开投屏');
      });
  }

  castBtn.addEventListener('click', function () {
    // 已投屏时点一下 = 停止，符合「开关式」直觉
    if (castCurrent) {
      stopCast();
    } else {
      openCastSheet();
    }
  });

  /**
   * 页面加载时恢复「上次在投屏」的状态。
   *
   * 场景：手机页面还开着，电脑那边 Jvedio 重启了。
   * 服务端的内存状态清空，但投影仪可能还在放（它拉着流，连接会断），
   * 或者用户以为还在投其实已经停了。这里主动问一次服务端，
   * 以服务端为准，避免界面显示「投屏中」实际控制不了。
   */
  function syncCastStateOnLoad() {
    apiFetch(API + '/api/cast/status')
      .then(function (r) { return r.json(); })
      .then(function (s) {
        if (s.casting) {
          castCurrent = s.device;
          castBtn.classList.add('on');
          // 如果播放页正开着且是同一个片子，直接进遥控界面
          if (playerPage.classList.contains('show') && currentVideo) {
            enterCastMode(s.device);
          }
        } else {
          castCurrent = null;
          castBtn.classList.remove('on');
        }
      })
      .catch(function () { /* 忽略 */ });
  }

  syncCastStateOnLoad();

  castMask.addEventListener('click', closeCastSheet);
  castRefresh.addEventListener('click', function () { searchCastDevices(true); });

  /**
   * 播放页内换片（点相似推荐）。
   *
   * 不能写成 closePlayer() + openPlayer()：
   * closePlayer 会 history.back()，紧接着 openPlayer 又 pushState，
   * 形成「回退+前进」，移动端会因此丢失历史栈，返回键失效。
   *
   * 这里只替换视频内容与历史条目的数据，界面保持打开，
   * 返回键行为与换片前完全一致（按一次回列表）。
   */
  function switchPlayerVideo(dataId) {
    var old = videoWrap.querySelector('video');
    if (old) {
      releaseVideo(old);
      videoWrap.innerHTML = '';
    }
    playerMeta.innerHTML = '';
    videoWrap.innerHTML = '<div class="loading" style="color:#8A8782"><div class="spinner"></div>打开中…</div>';

    // 就地更新历史条目，不新增
    try { history.replaceState({ player: dataId }, ''); } catch (e) { /* 忽略 */ }

    var token = ++playerToken;

    apiFetch(API + '/api/video/' + dataId)
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (token !== playerToken) return;
        renderPlayer(d);
      })
      .catch(function (err) {
        if (token !== playerToken) return;
        videoWrap.innerHTML = '';
        videoWrap.appendChild(el('div', 'player-error', '无法加载详情：' + err.message));
      });
  }

  /**
   * 规范地停止并释放 video 元素。
   *
   * 早期实现直接 innerHTML = '' 移除正在播放的 video，
   * 浏览器会在解码线程上做清理，部分移动端（Android Chrome / 鸿蒙 WebView）
   * 会因此卡住，表现为点关闭后界面假死。
   *
   * 正确顺序：pause 停止解码 -> 清 src 让浏览器放弃缓冲 -> load() 复位。
   */
  function releaseVideo(video) {
    if (!video)
      return;

    try {
      video.pause();
    } catch (e) { /* 已销毁 */ }

    try {
      // 移除 src 后调 load()，浏览器会中止当前请求并释放缓冲
      video.removeAttribute('src');
      video.srcObject = null;
      video.load();
    } catch (e) { /* 个别浏览器不支持 */ }

    // 移除事件监听，避免持有闭包引用
    try {
      video.onloadedmetadata = null;
      video.ontimeupdate = null;
      video.onerror = null;
    } catch (e) { /* 忽略 */ }
  }

  backBtn.addEventListener('click', closePlayer);

  /* ---------- 筛选与搜索 ---------- */

  function loadLibraries() {
    apiFetch(API + '/api/libraries')
      .then(function (r) { return r.json(); })
      .then(function (libs) {
        libsEl.innerHTML = '';
        var all = el('button', 'lib-chip active', '全部');
        all.dataset.db = '0';
        libsEl.appendChild(all);

        libs.forEach(function (lib) {
          var chip = el('button', 'lib-chip', lib.Name);
          chip.dataset.db = String(lib.DBId);
          libsEl.appendChild(chip);
        });

        // 恢复上次选中的库（页面重建后状态要一致，否则列表范围悄悄变了）
        if (state.dbId > 0) {
          Array.prototype.forEach.call(libsEl.children, function (c) {
            c.classList.toggle('active', (parseInt(c.dataset.db, 10) || 0) === state.dbId);
          });
        }

        libsEl.addEventListener('click', function (e) {
          var chip = e.target.closest('.lib-chip');
          if (!chip) return;
          Array.prototype.forEach.call(libsEl.children, function (c) { c.classList.remove('active'); });
          chip.classList.add('active');
          state.dbId = parseInt(chip.dataset.db, 10) || 0;
          // 切库 = 换了浏览范围，退出「收藏/最近播放」视图
          reset(true);
        });
      })
      .catch(function () { /* 库列表失败不影响主流程 */ });
  }

  /**
   * 重置列表并重新加载。
   *
   * exitView: 是否同时把「视图」退回「全部」。
   *
   * 为什么要这个参数：state.view（全部/收藏/最近播放）和 state.dbId
   * （库）、state.keyword（搜索）是**不同维度**的筛选条件，
   * 但都会收窄结果集。用户切到「我的收藏」后再点其它库或搜索时，
   * 若不清掉 view，收藏条件会一直叠加，表现为「点了其它功能退不出去」。
   *
   * 所以：切库、搜索、应用筛选 —— 这些「用户主动换了浏览范围」的操作
   * 要 exitView=true；而点击视图标签本身时，view 由点击目标决定。
   */
  function reset(exitView) {
    state.page = 1;
    state.done = false;
    state.loading = false;

    // 任何进入列表模式的操作都自动退出随机推荐状态——统一在这里处理，
    // 避免每个入口各写一遍而漏掉某一个。
    if (state.mode === 'random') {
      state.mode = 'list';
      randomBtn.classList.remove('active');
    }
    // 退出随机后旧的快照必须作废，否则下次恢复会把过期的随机结果又摆出来
    state.randomItems = null;

    if (exitView) {
      state.view = '';
      // 同步按钮高亮，否则数据变了但标签还亮着「我的收藏」
      var tabs = document.querySelectorAll('.view-tab');
      Array.prototype.forEach.call(tabs, function (t) {
        t.classList.toggle('on', (t.dataset.view || '') === '');
      });
    }

    saveListState();
    loadPage();
  }

  /* ---------- 浏览状态持久化 ----------
     手机上进播放页/全屏后退出，浏览器可能重建页面（内存 state 全丢），
     表现为「随机推荐点进去看一部，退出来回到最开始的列表页」。
     把「当前是随机还是列表、哪个库、搜索词、视图、滚动位置」存进
     sessionStorage，页面重建后原样恢复。sessionStorage 关标签即清，不会长期残留。
  */
  var LIST_STATE_KEY = 'jvedio.listState';

  function saveListState() {
    try {
      sessionStorage.setItem(LIST_STATE_KEY, JSON.stringify({
        mode: state.mode,
        dbId: state.dbId,
        keyword: state.keyword,
        view: state.view,
        randomItems: state.mode === 'random' ? state.randomItems : null,
        scrollY: window.scrollY || 0
      }));
    } catch (e) { /* 隐私模式禁用存储时忽略 */ }
  }

  function readListState() {
    try {
      var raw = sessionStorage.getItem(LIST_STATE_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch (e) {
      return null;
    }
  }

  // 搜索防抖
  var searchTimer = null;
  searchInput.addEventListener('input', function () {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(function () {
      state.keyword = searchInput.value.trim();
      // 搜索是全局的，退出「收藏/最近播放」视图，
      // 否则会出现「在收藏里搜不到、但内容其实存在」的困惑
      reset(true);
    }, 350);
  });

  /* ---------- 无限滚动 ---------- */

  var sentinel = null;

  function setupInfiniteScroll() {
    sentinel = document.createElement('div');
    sentinel.style.height = '1px';
    document.body.appendChild(sentinel);

    if ('IntersectionObserver' in window) {
      new IntersectionObserver(function (entries) {
        if (entries[0].isIntersecting) loadPage();
      }, { rootMargin: '600px' }).observe(sentinel);
    } else {
      // 兜底：滚动监听
      window.addEventListener('scroll', function () {
        if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 600) loadPage();
      });
    }

    // 记滚动位置：播放页退出/页面重建后要能滚回原来的位置
    var scrollSaveTimer = null;
    window.addEventListener('scroll', function () {
      clearTimeout(scrollSaveTimer);
      scrollSaveTimer = setTimeout(saveListState, 400);
    }, { passive: true });
  }

    /* ============================================================
     视图切换（全部 / 收藏 / 最近播放）
     ============================================================ */

  var viewTabs = document.getElementById('viewTabs');

  viewTabs.addEventListener('click', function (e) {
    var tab = e.target.closest('.view-tab');
    if (!tab) return;

    Array.prototype.forEach.call(viewTabs.children, function (c) { c.classList.remove('on'); });
    tab.classList.add('on');

    state.view = tab.dataset.view || '';
    state.mode = 'list';
    randomBtn.classList.remove('active');
    // 这里 view 由点击目标决定，不能再让 reset 清掉
    reset(false);
  });

  /* ============================================================
     收藏与评分
     ============================================================ */

  function postJson(url) {
    return apiFetch(url, { method: 'POST' }).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    });
  }

  function setGrade(dataId, grade, onDone) {
    postJson(API + '/api/rate/' + dataId + '?grade=' + grade)
      .then(function () { if (onDone) onDone(grade); })
      .catch(function (err) { alert('操作失败：' + err.message); });
  }

  function markWatched(dataId) {
    postJson(API + '/api/watched/' + dataId).catch(function () {
      // 记录观看失败不影响播放
    });
  }

  /* ============================================================
     随机推荐
     ============================================================ */

  var sectionHead = null;

  /**
   * 渲染「随机推荐」结果。
   *
   * 单独抽出来是为了能在「恢复上次浏览状态」时复用：
   * 手机上点进播放页再退出时，部分浏览器会重建整个页面（尤其全屏播放后），
   * 页面重建后 state 是全新的，如果只靠内存里的 state 就会退回默认列表页。
   */
  function renderRandomItems(items) {
    grid.innerHTML = '';

    var head = el('div', 'section-head');
    var title = el('div', 'section-title', '随机推荐');
    var again = el('button', 'section-action', '换一批');
    again.addEventListener('click', function () { showRandom(); });
    head.appendChild(title);
    head.appendChild(again);
    grid.appendChild(head);

    if (!items.length) {
      grid.appendChild(el('div', 'empty', '没有可推荐的内容'));
    } else {
      items.forEach(function (item) { grid.appendChild(renderCard(item)); });
    }
    countBadge.textContent = items.length + ' 部';
  }

  function showRandom() {
    state.mode = 'random';
    randomBtn.classList.add('active');

    // 随机推荐与「收藏/最近播放」是互斥的两种浏览方式：
    // 留在收藏视图里点随机，会让用户以为随机结果被限制了。
    // 这里主动退出视图，标签高亮同步回「全部」。
    if (state.view) {
      state.view = '';
      var tabs = document.querySelectorAll('.view-tab');
      Array.prototype.forEach.call(tabs, function (t) {
        t.classList.toggle('on', (t.dataset.view || '') === '');
      });
    }

    grid.innerHTML = '';
    grid.appendChild(el('div', 'loading', '')).innerHTML = '<div class="spinner"></div>随机挑选中…';
    showProgress(true);

    var url = API + '/api/random?count=24';
    if (state.dbId > 0) url += '&dbId=' + state.dbId;

    apiFetch(url)
      .then(function (r) { return r.json(); })
      .then(function (data) {
        var items = data.Items || [];
        renderRandomItems(items);
        state.randomItems = items;
        saveListState();
      })
      .catch(function (err) {
        grid.innerHTML = '';
        grid.appendChild(el('div', 'empty', '随机推荐失败：' + err.message));
      })
      .then(function () { showProgress(false); });
  }

  randomBtn.addEventListener('click', function () {
    // 随机推荐是「开关式」：
    // 未激活 -> 点一下进入随机并立即出结果
    // 已激活 -> 再点一下换一批（保持激活状态）
    // 任何其它操作（切分类/搜索/切视图/筛选）都会退出随机状态
    showRandom();
  });

  /* ============================================================
     筛选面板
     ============================================================ */

  // 后端字段名 -> 中文标签
  var FILTER_LABELS = {
    genres: '分类',
    studios: '发行商',
    series: '系列',
    directors: '导演',
    actors: '演员',
  };

  var filtersData = null;

  function openSheet() {
    sheetMask.classList.add('show');
    filterSheet.classList.add('show');
    filterBtn.classList.add('active');
    lockScroll();

    // 每次打开都回到顶部，避免停留在上次滚动位置
    sheetBody.scrollTop = 0;

    if (!filtersData) loadFilters();
    else sheetBody.scrollTop = 0;
  }

  function closeSheet() {
    sheetMask.classList.remove('show');
    filterSheet.classList.remove('show');
    filterBtn.classList.remove('active');
    unlockScroll();
  }

  function loadFilters() {
    apiFetch(API + '/api/filters')
      .then(function (r) { return r.json(); })
      .then(function (data) {
        filtersData = data;
        renderFilters();
      })
      .catch(function (err) {
        sheetBody.innerHTML = '';
        sheetBody.appendChild(el('div', 'empty', '筛选项加载失败：' + err.message));
      });
  }

  function renderFilters() {
    sheetBody.innerHTML = '';

    Object.keys(FILTER_LABELS).forEach(function (key) {
      var list = filtersData[key];
      if (!list || !list.length) return;

      var group = el('div', 'filter-group');

      var label = el('div', 'filter-label');
      label.appendChild(document.createTextNode(FILTER_LABELS[key]));
      var counter = el('span', 'sel-count');
      counter.dataset.for = key;
      label.appendChild(counter);
      group.appendChild(label);

      var wrap = el('div', 'chip-wrap');
      // 只展示前 30 项，避免面板过长（后端已按频次排序）
      list.slice(0, 30).forEach(function (item) {
        var chip = el('button', 'chip');
        chip.type = 'button';
        chip.dataset.field = key;
        chip.dataset.value = item.Name;
        chip.appendChild(document.createTextNode(item.Name));
        var n = el('span', 'chip-n', item.Count);
        chip.appendChild(n);

        if (isSelected(key, item.Name)) chip.classList.add('on');

        chip.addEventListener('click', function () {
          toggleFilter(key, item.Name);
          chip.classList.toggle('on');
          updateCounter(key);
        });

        wrap.appendChild(chip);
      });
      group.appendChild(wrap);
      sheetBody.appendChild(group);
    });

    Object.keys(FILTER_LABELS).forEach(updateCounter);

    // 渲染后归零滚动位置。
    // 必须放在渲染之后：浏览器会在内容插入时保留/调整滚动位置，
    // 渲染前设 scrollTop 会被覆盖（实测渲染前设 0，插入内容后变成 1889）。
    sheetBody.scrollTop = 0;
    requestAnimationFrame(function () { sheetBody.scrollTop = 0; });
  }

  function isSelected(field, value) {
    var arr = state.filters[field];
    return !!(arr && arr.indexOf(value) >= 0);
  }

  function toggleFilter(field, value) {
    if (!state.filters[field]) state.filters[field] = [];
    var arr = state.filters[field];
    var i = arr.indexOf(value);
    if (i >= 0) arr.splice(i, 1);
    else arr.push(value);
    if (!arr.length) delete state.filters[field];
  }

  function updateCounter(field) {
    var el2 = sheetBody.querySelector('.sel-count[data-for="' + field + '"]');
    if (!el2) return;
    var n = (state.filters[field] || []).length;
    el2.textContent = n > 0 ? n : '';
  }

  filterBtn.addEventListener('click', openSheet);
  sheetMask.addEventListener('click', closeSheet);

  sheetReset.addEventListener('click', function () {
    state.filters = {};
    sheetBody.querySelectorAll('.chip.on').forEach(function (c) { c.classList.remove('on'); });
    Object.keys(FILTER_LABELS).forEach(updateCounter);
    // 重置后立即回列表生效，不需要用户再点「应用」。
    // 之前只清本地状态不重载，用户会看到「点了重置但列表没变」。
    // 面板保持打开，方便继续调整。
    reset(true);
  });

  sheetApply.addEventListener('click', function () {
    closeSheet();
    state.mode = 'list';
    randomBtn.classList.remove('active');
    // 筛选是精细条件，退出「收藏/最近播放」视图避免条件叠加导致空结果
    reset(true);
  });

  /* ============================================================
     相似推荐（详情页内）
     ============================================================ */

  /**
   * 相似推荐。
   *
   * light: 详情页（浅色底）用 true，播放页（深色底）用 false。
   * 两处底色相反，不能共用一套配色，否则浅底上的白字会看不见。
   *
   * 预留高度很重要：这个区块是异步来的，如果容器初高 0，
   * 数据回来前页面总高不够，用户会觉得「刚进详情页滚不动，
   * 等一会儿才能滚」。所以先把标题和一行骨架铺上，
   * 高度与真实结果接近，数据到了原地替换，视觉上不跳。
   */
  function loadSimilar(dataId, container, light) {
    if (light) container.classList.add('similar-light');

    // 骨架：标题 + 12 张占位卡。
    // 数量要和真实结果一致（接口固定要 12 张），否则数据到达时
    // 高度会从「1 行」跳到「2 行」，滚动位置和总高都会抖一下。
    var phHead = el('div', 'section-head');
    phHead.appendChild(el('div', 'section-title', '相似推荐'));
    container.appendChild(phHead);

    var phRow = el('div', 'similar-row');
    for (var i = 0; i < 12; i++) {
      var ph = el('div', 'similar-card similar-ph');
      ph.appendChild(el('div', 'similar-ph-img'));
      phRow.appendChild(ph);
    }
    container.appendChild(phRow);

    apiFetch(API + '/api/similar/' + dataId + '?count=12')
      .then(function (r) { return r.json(); })
      .then(function (data) {
        var items = data.Items || [];
        if (!items.length) {
          container.remove();
          return;
        }

        // 原地替换骨架，不做 append，避免高度翻倍
        container.innerHTML = '';

        var head = el('div', 'section-head');
        head.appendChild(el('div', 'section-title', '相似推荐'));
        container.appendChild(head);

        var row = el('div', 'similar-row');
        items.forEach(function (item) {
          var card = el('div', 'similar-card');
          var img = document.createElement('img');
          img.loading = 'lazy';
          img.src = withToken(item.SmallImageUrl || item.BigImageUrl);
          img.alt = item.VID || '';
          card.appendChild(img);
          card.appendChild(el('div', 'similar-vid', item.VID || item.Title || fileNameOf(item.FileName) || ''));
          card.addEventListener('click', function () {
            // 从播放页点相似项 = 换片播放；从详情页点 = 换到那部的详情
            if (playerPage.classList.contains('show')) {
              switchPlayerVideo(item.DataID);
            } else {
              detailBody.scrollTop = 0;
              openDetail(item.DataID);
            }
          });
          row.appendChild(card);
        });
        container.appendChild(row);
      })
      .catch(function () { container.remove(); });
  }

  /* ---------- 启动 ---------- */

  /* ============================================================
     登录流程

     顺序很重要：先问 /api/auth/status，
     - 没开口令 → 直接启动，和以前完全一样
     - 开口令且已登录 → 直接启动
     - 开口令且未登录 → 显示遮罩，登录成功后再启动
     ============================================================ */

  var loginMask = document.getElementById('loginMask');
  var loginInput = document.getElementById('loginInput');
  var loginBtn = document.getElementById('loginBtn');
  var loginError = document.getElementById('loginError');

  var booted = false;      // 是否已跑过初始化，避免重复加载

  function showLogin(message) {
    loginMask.classList.add('show');
    loginError.textContent = message || '';
    loginInput.value = '';
    // 延迟聚焦：iOS 上直接 focus 常常无效
    setTimeout(function () { try { loginInput.focus(); } catch (e) { } }, 120);
  }

  function hideLogin() {
    loginMask.classList.remove('show');
    loginError.textContent = '';
  }

  function bootApp() {
    if (booted) return;
    booted = true;
    loadLibraries();

    // 恢复上次的浏览状态（见 saveListState 的说明）：
    // 随机推荐正在看的时候点进播放页、退出后页面被浏览器重建，
    // 这里把随机结果和滚动位置摆回去，而不是退回默认列表页。
    var saved = readListState();
    if (saved) {
      if (typeof saved.dbId === 'number') state.dbId = saved.dbId;
      if (typeof saved.keyword === 'string') {
        state.keyword = saved.keyword;
        if (saved.keyword) searchInput.value = saved.keyword;
      }
      if (typeof saved.view === 'string') state.view = saved.view;

      if (saved.mode === 'random' && saved.randomItems && saved.randomItems.length) {
        state.mode = 'random';
        randomBtn.classList.add('active');
        renderRandomItems(saved.randomItems);
        // 等一帧再滚，否则 grid 还没完成布局，scrollTo 会被裁到 0
        var y = saved.scrollY || 0;
        requestAnimationFrame(function () { window.scrollTo(0, y); });
        setupInfiniteScroll();
        return;
      }
    }

    loadPage();
    setupInfiniteScroll();
  }

  function doLogin() {
    var pwd = (loginInput.value || '').trim();
    if (!pwd) {
      loginError.textContent = '请输入口令';
      return;
    }

    loginBtn.disabled = true;
    loginError.textContent = '';
    loginBtn.textContent = '验证中…';

    fetch(API + '/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: pwd })
    })
      .then(function (r) {
        return r.json().then(function (j) {
          if (!r.ok) throw new Error(j.error || '口令不正确');
          return j;
        });
      })
      .then(function (j) {
        if (j.token) setToken(j.token);
        hideLogin();
        bootApp();
      })
      .catch(function (err) {
        loginError.textContent = err.message || '登录失败';
        loginInput.focus();
        loginInput.select();
      })
      .then(function () {
        loginBtn.disabled = false;
        loginBtn.textContent = '进入';
      });
  }

  loginBtn.addEventListener('click', doLogin);
  loginInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); doLogin(); }
  });

  /**
   * 启动：先确认鉴权状态。
   */
  (function start() {
    fetch(API + '/api/auth/status', {
      headers: getToken() ? { 'Authorization': 'Bearer ' + getToken() } : {}
    })
      .then(function (r) { return r.json(); })
      .then(function (s) {
        if (!s.required) {
          // 未启用口令：完全无感，直接进入
          hideLogin();
          bootApp();
          return;
        }
        if (s.authenticated) {
          hideLogin();
          bootApp();
          return;
        }
        // 需要口令
        showLogin('');
      })
      .catch(function () {
        // 状态接口都拿不到（服务刚起来 / 网络抖动），
        // 按「未启用口令」处理，保证可用性优先
        hideLogin();
        bootApp();
      });
  })();

  // 返回键：先关最上层（播放页 > 详情页），不要直接退出网站
  window.addEventListener('popstate', function () {
    if (playerPage.classList.contains('show')) {
      // 由返回键触发，历史记录已经回退过了，标记一下避免 closePlayer 再次回退
      playerClosingByBack = true;
      closePlayer();
      return;
    }
    if (detailPage.classList.contains('show')) {
      detailClosingByBack = true;
      closeDetail();
    }
  });

})();
</script>
</body>
</html>
